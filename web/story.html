<!doctype html>
<meta charset="utf-8">
<title>FSNI Stories — Quantara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1320; --s1: #151d2e; --s2: #1c2538; --s3: #232f47; --border: #2a3a55;
  --accent: #00c8f0; --green: #00e676; --red: #ff3d5a; --amber: #ffb300;
  --text: #f8faff; --muted: #7a95b8; --dim: #4a6080;
  --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
[hidden] { display: none !important }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px; overflow-x: hidden;
}
a { color: var(--accent) }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; background: rgba(15,19,32,.97); border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 3px }
.logo em { color: var(--muted); font-style: normal }
.nav { display: flex; gap: 8px; flex-wrap: wrap }
.nav a { font-family: var(--mono); font-size: 10px; color: var(--muted); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px }
.nav a:hover, .nav a.on { color: var(--accent); border-color: var(--accent) }
main { max-width: 1240px; margin: 0 auto; padding-top: 18px; display: grid; gap: 18px }
.lbl { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px }
.panel { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; min-width: 0 }
/* moderator panel: each part gets a big heading, a one-line explanation and a divider */
.msec { margin-top: 22px; padding: 16px 14px 6px; border-top: 3px solid var(--border) }
#cands > .msec:first-child { margin-top: 0; border-top: 0 }
.msec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: var(--text) }
.msec-d { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45 }
.msub { font-size: 14px; font-weight: 700; color: var(--text); padding: 12px 14px 2px; border-top: 1px dashed var(--border); margin-top: 8px }
.panel > .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border) }
.panel > .pb { padding: 14px }
.rules { display: flex; gap: 10px 22px; flex-wrap: wrap; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.5 }
.rules b { color: var(--text); font-family: var(--mono); font-weight: 700 }
.empty { padding: 24px 14px; color: var(--muted); font-size: 13px; line-height: 1.6 }
.mono { font-family: var(--mono) }
.up { color: var(--red) } .down { color: var(--green) } .flat { color: var(--muted) }

/* status pills */
.pill { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 3px; white-space: nowrap }
.pill.LISTED { background: var(--amber); color: var(--bg) }
.pill.CLOSED { border: 1px solid var(--dim); color: var(--muted) }
.pill.MERGED { border: 1px solid var(--muted); color: var(--muted) }
.pill.DELISTED { border: 1px solid var(--red); color: var(--red) }
.dl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.dl input { flex: 1 1 200px; min-width: 0; padding: 7px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 12px }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red) }
.pill.WATCHING { border: 1px solid var(--accent); color: var(--accent) }
.tag { font-family: var(--mono); font-size: 9px; padding: 1px 5px; background: var(--s3); border-radius: 2px; color: var(--muted) }

/* board */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px }
.card { display: grid; gap: 8px; padding: 12px; background: var(--s2); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: inherit; min-width: 0 }
.card:hover { border-color: var(--accent) }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.4; text-wrap: balance }
.card-title.short { font-size: 17px; font-weight: 700; line-height: 1.25 }
.ask { font-size: 12px; color: var(--text); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline }
.ask b { font-family: var(--mono); font-size: 11px }
.ask .y { color: var(--green) } .ask .n { color: var(--red) }
.intent-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.intent-btns button { font: 700 13px var(--sans); padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--s2); color: var(--text); cursor: pointer }
.intent-btns button.on.y { border-color: var(--green); color: var(--green) }
.intent-btns button.on.n { border-color: var(--red); color: var(--red) }
.fri { display: grid; grid-template-columns: minmax(200px, 260px) 1fr; gap: 10px 24px; padding: 14px; align-items: start }
.fri .lbl { font: 700 10px var(--mono); letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px }
.fri-v { font: 700 34px var(--mono); line-height: 1.1 } .fri-v small { font-size: 12px }
.fri .m { font-size: 13px; color: var(--muted); padding: 2px 0 } .fri .m b { color: var(--text) } .fri .m a { color: var(--text) }
@media (max-width: 640px) { .fri { grid-template-columns: 1fr } }
.spot-form { display: grid; gap: 8px; padding: 12px 14px }
.spot-form input, .spot-form textarea { background: var(--s2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px; font: 13px var(--sans) }
.spot-form textarea { min-height: 70px; resize: vertical }
.pill.spot { color: var(--amber); border-color: var(--amber) }
.spot-card { border-style: dashed }
.spot-list { display: grid; padding: 4px 14px 12px } .spot-list .lbl { font: 700 10px var(--mono); letter-spacing: 1px; color: var(--muted); text-transform: uppercase; padding: 6px 0 }
.spot-row { display: flex; gap: 12px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 13px; flex-wrap: wrap }
.spot-row span { color: var(--muted); font-size: 12px } .spot-row .go { margin-left: auto; color: var(--accent) }
.reported .li { display: grid; gap: 4px }
.spot-badge { font: 700 10px var(--mono); color: var(--amber); margin: 4px 0 }
.spot-state { margin-top: 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 6px; font-size: 13px }
.spot-state.ok { border-color: var(--green) }
.cases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border) }
@media (max-width: 640px) { .cases { grid-template-columns: 1fr } }
.case { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: grid; gap: 6px; align-content: start }
.case-YES { border-top: 3px solid var(--red) } .case-NO { border-top: 3px solid var(--green) }
.case .lbl { font: 700 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted) }
.case-body { font-size: 13px; line-height: 1.45 }
.case .m { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted) } .case .m a { color: var(--accent) }
.ev { font: 700 10px var(--mono); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border) }
.ev-YES { color: var(--red); border-color: var(--red) } .ev-NO { color: var(--green); border-color: var(--green) }
.chip.on { border-color: var(--accent); color: var(--accent); opacity: 1 }
.chip.ev-YES.on { border-color: var(--red); color: var(--red) } .chip.ev-NO.on { border-color: var(--green); color: var(--green) }
.called { font: 700 10px var(--mono); padding: 2px 6px; border-radius: 4px }
.called.win { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent) }
.called.lose { color: var(--muted) }
.cm-link { display: inline-block; font-size: 12px; color: var(--accent); margin-top: 4px; text-decoration: none }
.cm.is-ev { border-left: 2px solid var(--border) }
.dc-link { width: 100%; margin-top: 6px; background: var(--s2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px; font: 13px var(--sans) }
.cm-act button.on { color: var(--accent) } .useful-n { font-size: 11px; color: var(--muted) }
.chart-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 12px; margin: 0 0 4px }
.chart-h b { font-size: 13px } .chart-h span { color: var(--muted) }
.howline { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; font-size: 13px }
.ibar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--s3) }
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; padding: 12px 14px }
.sec { background: var(--s2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 6px; min-width: 0 }
.sec .nm { font-weight: 700; font-size: 13px }
.sec .px { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1 }
.sec .ch { font-family: var(--mono); font-size: 12px }
.sec .drv { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sec .drv a { color: var(--muted) }
.sec .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.sec .btns button { font: 700 11px var(--mono); padding: 8px 4px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--s1); color: var(--text) }
.sec .btns .b { border-color: var(--green); color: var(--green) } .sec .btns .s { border-color: var(--red); color: var(--red) }
.sec-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 14px 12px; font-size: 12px; color: var(--muted) }
.sec-bar input { width: 70px; background: var(--s2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font: 12px var(--mono) }
.ibar i { display: block; height: 100% }
.orig { font-size: 11px; color: var(--muted); line-height: 1.4 }
.ttl-edit { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.ttl-edit input { flex: 1 1 240px; min-width: 0; background: var(--s2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 9px; font: 13px var(--sans) }
.card-row { display: flex; align-items: end; justify-content: space-between; gap: 10px }
.card-score { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1 }
.card-score small { font-size: 11px; font-weight: 400; margin-left: 6px }
.card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap }
.bar { height: 4px; background: var(--s3); border-radius: 2px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }

/* story */
.s-head { display: grid; gap: 10px; padding: 16px 14px }
.s-title { font-size: 22px; font-weight: 700; line-height: 1.3; text-wrap: balance; max-width: 60ch }
.s-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.hero { display: flex; gap: 22px; flex-wrap: wrap; align-items: end; padding: 14px }
.hero-score { font-family: var(--mono); font-size: 48px; font-weight: 700; line-height: 1 }
.stat { display: grid; gap: 3px }
.stat .v { font-family: var(--mono); font-size: 16px; font-weight: 700 }
.window { padding: 0 14px 14px; display: grid; gap: 6px }
.window .bar { height: 6px }
.window-txt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); gap: 8px; flex-wrap: wrap }
.chart-wrap { padding: 8px 14px 14px; position: relative }
.chart-wrap svg { width: 100%; height: 170px; display: block }
.chart-wrap svg#sp { height: 120px }
.chart-tip { font-family: var(--mono); font-size: 10px; color: var(--muted); min-height: 14px; margin-top: 4px }
.list { display: grid }
.li { display: grid; gap: 3px; padding: 10px 14px; border-bottom: 1px solid var(--border); min-width: 0 }
.li:last-child { border-bottom: none }
.li a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.4 }
.li a:hover { color: var(--accent) }
.li .m { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.outlets { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 14px }
.note { padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.6 }
.note b { color: var(--text) }
.side { display: grid; gap: 18px; min-width: 0 }
/* trading */
.tp { display: grid; gap: 12px; padding: 14px }
.tp-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tp-side { display: grid; gap: 6px; padding: 10px; border-radius: 6px; background: var(--s2); border: 1px solid var(--border) }
.tp-side.grow { border-color: rgba(255,61,90,.45) }
.tp-side.fade { border-color: rgba(0,230,118,.45) }
.tp-side .lbl b { color: var(--text) }
.tp-price { font-family: var(--mono); font-size: 22px; font-weight: 700 }
.tp-side.grow .tp-price { color: var(--red) }
.tp-side.fade .tp-price { color: var(--green) }
.tp-pays { font-size: 11px; color: var(--muted); line-height: 1.4 }
.tp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.tp-row input { width: 80px; padding: 7px 8px; font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px }
.btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 9px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--s3); color: var(--text); cursor: pointer }
.btn:disabled { opacity: .4; cursor: not-allowed }
.btn.grow { background: var(--red); border-color: var(--red); color: #fff }
.btn.fade { background: transparent; border-color: var(--green); color: var(--green) }
.btn.ghost { background: transparent; color: var(--muted) }
.tp-cost { font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tp-msg { font-size: 12px; min-height: 16px }
.tp-msg.err { color: var(--red) } .tp-msg.ok { color: var(--green) }
.tp-pos { display: grid; gap: 4px; padding: 10px; border-radius: 6px; background: var(--s2) }
.kv { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.kv b { color: var(--text) }
.login { display: grid; gap: 8px; padding: 14px }
.login input { padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; min-width: 0 }
.tr { display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tr:last-child { border-bottom: none }
.tr b.GROW { color: var(--red) } .tr b.FADE { color: var(--green) }
/* discussion */
.dc-read { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--border) }
.dc-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--s3) }
.dc-bar i { display: block; height: 100% }
.dc-legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--muted) }
.dc-legend b { color: var(--text) }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle }
.v-REAL { background: var(--red) } .v-EXAGGERATED { background: var(--amber) } .v-HYPE { background: var(--accent) }
.dc-form { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border) }
.dc-form textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; font: 13px/1.5 var(--sans) }
.dc-form textarea:focus, .tp-row input:focus, .login input:focus { outline: 1px solid var(--accent); border-color: var(--accent) }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.chip { font-family: var(--mono); font-size: 10px; padding: 4px 9px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer }
.chip.on.REAL, .chip.on.EXAGGERATED, .chip.on.HYPE { color: var(--bg); border-color: transparent }
.chip.on.REAL { background: var(--red) } .chip.on.EXAGGERATED { background: var(--amber) } .chip.on.HYPE { background: var(--accent) }
.dc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.dc-hint { font-size: 11px; color: var(--dim) }
.cm { display: grid; gap: 5px; padding: 12px 14px; border-bottom: 1px solid var(--border); min-width: 0 }
.cm:last-child { border-bottom: none }
.cm.reply { margin-left: 22px; padding-left: 12px; border-left: 2px solid var(--s3); border-bottom: none; padding-block: 8px }
.cm-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--muted) }
.cm-head .who { color: var(--text); font-weight: 700; font-size: 11px }
.cm-body { font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere }
.cm-body.gone { color: var(--dim); font-style: italic }
.pos { font-family: var(--mono); font-size: 9px; padding: 1px 6px; border-radius: 3px; border: 1px solid }
.pos.GROW { color: var(--red); border-color: rgba(255,61,90,.5) } .pos.FADE { color: var(--green); border-color: rgba(0,230,118,.5) }
.vd { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 6px; border-radius: 3px; color: var(--bg) }
.cm-act { display: flex; gap: 12px; flex-wrap: wrap }
.cm-act button { background: none; border: none; padding: 0; font-family: var(--mono); font-size: 10px; color: var(--dim); cursor: pointer }
.cm-act button:hover { color: var(--accent) }
.cm-act button.danger:hover { color: var(--red) }
.mod { font-family: var(--mono); font-size: 9px; color: var(--amber) }
/* score breakdown */
.bd { display: grid; gap: 10px; padding: 14px }
.bd-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 76px; gap: 10px; align-items: center }
.bd-name { font-size: 12px; font-weight: 600 }
.bd-name small { display: block; font-family: var(--mono); font-size: 9px; color: var(--muted); font-weight: 400 }
.bd-bar { height: 8px; background: var(--s3); border-radius: 4px; overflow: hidden }
.bd-bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px }
.bd-pts { font-family: var(--mono); font-size: 12px; text-align: right }
.bd-pts span { color: var(--muted); font-size: 10px }
.bd-detail { grid-column: 2 / 4; font-size: 11px; color: var(--muted); margin-top: -6px }
.bd-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: var(--muted) }
.bd-sum b { color: var(--text) }
.bd-note { font-size: 12px; color: var(--muted); line-height: 1.55 }
.bd-note b { color: var(--text) }
@media (max-width: 500px) { .bd-row { grid-template-columns: 76px minmax(0, 1fr) 64px } }
.arena { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 3px; white-space: nowrap }
.arena.brands { background: rgba(179,136,255,.18); color: #c9a8ff; border: 1px solid rgba(179,136,255,.45) }
.arena.food { background: rgba(0,230,118,.12); color: var(--green); border: 1px solid rgba(0,230,118,.4) }
.sector { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 2px 7px; border-radius: 3px; background: rgba(0,200,240,.12); color: var(--accent); border: 1px solid rgba(0,200,240,.4); text-transform: uppercase; white-space: nowrap }
.trend { font-family: var(--mono); font-size: 10px; color: var(--amber) }
.co { font-size: 12px; color: var(--text); font-weight: 600 }
.co::before { content: "🏢 "; }
.house { padding: 10px 14px; font-size: 11px; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); background: var(--s2) }
.house b { color: var(--text) }
.buzz-bars { display: flex; align-items: flex-end; gap: 2px; height: 28px }
.buzz-bars i { flex: 1; background: var(--accent); opacity: .7; border-radius: 1px; min-width: 3px }
.fb { font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--amber); border: 1px solid rgba(255,179,0,.5); border-radius: 3px; padding: 0 5px; white-space: nowrap }
.tabs { display: flex; gap: 6px }
.tabs button { font-family: var(--mono); font-size: 10px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer }
.tabs button.on { color: var(--text); border-color: var(--accent) }
.tbl-wrap { overflow-x: auto }
table.lb { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px }
table.lb th { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 9px 14px; border-bottom: 1px solid var(--border) }
table.lb td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
table.lb th:nth-child(2), table.lb td:nth-child(2) { text-align: left }
table.lb td.name { font-family: var(--sans); font-weight: 600 }
table.lb tr.me td { background: rgba(0,200,240,.07) }
table.lb td.best { font-family: var(--sans); font-size: 11px; color: var(--muted); text-align: left; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
table.lb th.best { text-align: left }
.rk { color: var(--muted) } .rk.top { color: var(--amber); font-weight: 700 }
.mine { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px }
</style>

<header>
  <a class="logo" href="/" style="text-decoration:none">QUANTARA</a>
  <nav class="nav">
    <a href="/stories" id="nav-board">Stories</a>
    <a href="/me" id="nav-me">Me</a>
    <a href="/company" style="margin-left:8px;border-style:dashed">For companies</a>
  </nav>
</header>

<main id="main"><div class="empty">Loading…</div></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : null;
function ago(ts) {
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function dur(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${String(m).padStart(2, "0")}m`;
}
function when(ts) {
  if (!ts) return "—";
  return new Date(ts * 1000).toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function scoreColor(v) { return v >= 60 ? "var(--red)" : v >= 30 ? "var(--amber)" : "var(--green)"; }
function delta(d) {
  if (d == null) return "";
  const c = d > 0.5 ? "up" : d < -0.5 ? "down" : "flat";
  const a = d > 0.5 ? "▲" : d < -0.5 ? "▼" : "●";
  return `<span class="${c}">${a} ${d >= 0 ? "+" : ""}${d.toFixed(1)} / 3h</span>`;
}
function spark(pts, w = 120, h = 30) {
  if (!pts || pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const xy = pts.map(p => [((p[0] - t0) / Math.max(1, t1 - t0)) * w, h - 2 - (Math.min(100, p[1]) / 100) * (h - 4)]);
  const y30 = h - 2 - 0.3 * (h - 4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y30}" y2="${y30}" stroke="var(--dim)" stroke-dasharray="2 3"/>
    <polyline fill="none" stroke="var(--amber)" stroke-width="1.6" points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}

// ── ACCOUNT (same login as the exchange and the FSNI page) ──
const ME = (() => { try { const id = localStorage.getItem("q_user_id"); return id ? { id, name: localStorage.getItem("q_username") || "" } : null; } catch (e) { return null; } })();
let LG = 0;
function loginHtml(why) {
  const k = ++LG;
  return `<div class="login"><div class="note" style="padding:0">${esc(why)}</div>
    <input id="lg-u${k}" placeholder="Username" autocomplete="username">
    <input id="lg-p${k}" type="password" placeholder="Password" autocomplete="current-password">
    <div class="tp-row"><button class="btn" onclick="doLogin(${k})">LOG IN</button><span class="tp-msg err" id="lg-msg${k}"></span></div></div>`;
}
async function doLogin(k) {
  const r = await fetch("/api/login_pw", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("#lg-u" + k).value, password: $("#lg-p" + k).value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("#lg-msg" + k).textContent = d.detail || "Login failed"; return; }
  try { localStorage.setItem("q_user_id", String(d.user_id)); localStorage.setItem("q_username", d.name); } catch (e) {}
  location.reload();
}
const cr = n => n == null ? "—" : Math.round(n).toLocaleString("en") + " cr";
const sgn = n => (n >= 0 ? "+" : "") + Math.round(n).toLocaleString("en");

const fBadge = n => `<span class="fb" title="Founding member — one of the first 100 traders">★ FOUNDER #${n}</span>`;
function navOn(id) { document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.id === id)); }

// ── LEADERBOARD ──
let LB_PERIOD = "all";
async function leaderboardPage() {
  document.title = "Leaderboard — Quantara"; navOn("nav-me");
  const q = `?period=${LB_PERIOD}` + (ME ? "&user_id=" + encodeURIComponent(ME.id) : "");
  let d; try { d = await (await fetch("/api/stories/leaderboard" + q)).json(); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load the leaderboard.</div>`; return; }
  const key = LB_PERIOD === "week" ? "profit_week" : "profit";
  const row = r => `<tr class="${ME && r.user_id === String(ME.id) ? "me" : ""}">
    <td class="rk ${r.rank <= 3 ? "top" : ""}">${r.rank}</td>
    <td class="name">${esc(r.name)} ${r.founding ? fBadge(r.founding) : ""}</td>
    <td class="${r[key] >= 0 ? "down" : "up"}">${sgn(r[key])}</td>
    <td>${r.stories}</td>
    <td>${r.win_rate == null ? "—" : r.win_rate + "%"}${r.early_wins ? ` <span title="early calls that won" style="color:var(--amber)">⚡${r.early_wins}</span>` : ""}</td>
    <td>${r.finished}${r.open ? ` <span style="color:var(--dim)">+${r.open} open</span>` : ""}</td>
    <td class="best">${r.best ? `<a href="/story/${encodeURIComponent(r.best.sid)}" style="color:inherit">${r.best.side} · ${esc(r.best.title)}</a> <span class="down">${sgn(r.best.profit)}</span>` : "—"}</td></tr>`;
  const me = d.me;
  $("#main").innerHTML = `
    <section class="panel">
      <div class="ph"><span class="lbl">Leaderboard</span>
        <div class="tabs"><button class="${LB_PERIOD === "all" ? "on" : ""}" onclick="LB_PERIOD='all';leaderboardPage()">ALL TIME</button>
          <button class="${LB_PERIOD === "week" ? "on" : ""}" onclick="LB_PERIOD='week';leaderboardPage()">THIS WEEK</button></div></div>
      <div class="rules">
        <span>${LB_PERIOD === "week" ? "Profit on calls <b>finished in the last 7 days</b>." : "Profit on every call — open positions at what they'd fetch if closed now."}</span>
        <span>A <b>call</b> is one bet on one story. <b>Win rate</b> counts finished calls with a profit.</span>
        <span><b>★ Founding members</b>: the first ${d.seats} people to trade — ${d.seats_taken} of ${d.seats} seats taken.</span>
      </div>
      ${me ? `<div class="mine">
        <div class="stat"><span class="lbl">Your rank</span><span class="v">#${me.rank} <span style="color:var(--muted);font-size:11px">of ${d.traders}</span></span></div>
        <div class="stat"><span class="lbl">${LB_PERIOD === "week" ? "Profit this week" : "Profit"}</span><span class="v ${me[key] >= 0 ? "down" : "up"}">${sgn(me[key])} cr</span></div>
        <div class="stat"><span class="lbl">Win rate</span><span class="v">${me.win_rate == null ? "—" : me.win_rate + "%"}</span></div>
        <div class="stat"><span class="lbl">Status</span><span class="v">${me.founding ? fBadge(me.founding) : "trader"}</span></div></div>` : ""}
      ${d.rows.length ? `<div class="tbl-wrap"><table class="lb"><thead><tr><th>#</th><th>Trader</th><th>Profit (cr)</th><th>Stories</th><th>Win rate</th><th>Calls</th><th class="best">Best call</th></tr></thead>
        <tbody>${d.rows.map(row).join("")}</tbody></table></div>`
        : `<div class="empty">${LB_PERIOD === "week" ? "No calls finished this week yet." : "Nobody has traded a story yet — the first 100 traders become founding members."}</div>`}
    </section>
    ${!ME ? `<section class="panel">${loginHtml("Log in to see your rank.")}</section>` : ""}`;
}

// ── MY HISTORY ──
async function historyPage() {
  document.title = "My History — Quantara"; navOn("nav-me");
  if (!ME) { $("#main").innerHTML = `<section class="panel"><div class="ph"><span class="lbl">My history</span></div>${loginHtml("Log in to see your story trading history.")}</section>`; return; }
  let d; try { d = await (await fetch("/api/stories/history/" + encodeURIComponent(ME.id))).json(); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load your history.</div>`; return; }
  const s = d.summary;
  const out = c => c.status === "OPEN" ? `open · ${c.held} held` : c.status === "SETTLED" ? `settled at ${(c.final ?? 0).toFixed(1)}${c.payout > 0 ? " · won" : " · lost"}` : c.status === "REFUNDED" ? "refunded" : "closed early";
  const row = c => `<tr>
    <td style="text-align:left;color:var(--muted)">${when(c.first_ts)}</td>
    <td class="name"><a href="/story/${encodeURIComponent(c.sid)}" style="color:inherit;text-decoration:none">${esc(c.title)}</a></td>
    <td style="color:${c.side === "GROW" ? "var(--red)" : "var(--green)"}">${c.side === "GROW" ? "YES / BEGINNING" : "NO / FORGOTTEN"}${c.early ? ` <span title="early call (first 12 h)" style="color:var(--amber)">⚡</span>` : ""}</td>
    <td>${c.bought}${c.sold ? ` <span style="color:var(--dim)">/ −${c.sold}</span>` : ""}</td>
    <td>${c.avg_price ?? "—"}</td>
    <td>${c.entry_score == null ? "—" : c.entry_score.toFixed(1)}</td>
    <td>${Math.round(c.paid).toLocaleString("en")}</td>
    <td>${Math.round(c.closed_for + c.payout + c.open_value).toLocaleString("en")}</td>
    <td class="${c.profit >= 0 ? "down" : "up"}">${sgn(c.profit)}</td>
    <td style="text-align:left;color:var(--muted);font-family:var(--sans);font-size:11px">${out(c)}</td></tr>`;
  $("#main").innerHTML = `
    <section class="panel">
      <div class="ph"><span class="lbl">My history · ${esc(d.name)}</span>${d.founding ? fBadge(d.founding) : ""}</div>
      <div class="mine">
        <div class="stat"><span class="lbl">Profit (all calls)</span><span class="v ${s.profit >= 0 ? "down" : "up"}">${sgn(s.profit)} cr</span></div>
        <div class="stat"><span class="lbl">Stories traded</span><span class="v">${s.stories}</span></div>
        <div class="stat"><span class="lbl">Win rate</span><span class="v">${s.win_rate == null ? "—" : s.win_rate + "%"} <span style="color:var(--muted);font-size:11px">${s.wins}/${s.finished}</span></span></div>
        <div class="stat"><span class="lbl">Best call</span><span class="v" style="font-size:12px">${s.best ? `${s.best.side} · ${esc(s.best.title.slice(0, 40))} <span class="down">${sgn(s.best.profit)}</span>` : "—"}</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="ph"><span class="lbl">All calls</span><span class="tag">${d.calls.length}</span></div>
      ${d.calls.length ? `<div class="tbl-wrap"><table class="lb" style="min-width:900px"><thead><tr>
        <th style="text-align:left">Opened</th><th>Story</th><th>Side</th><th>Units</th><th>Avg price</th><th>Score at entry</th><th>Paid</th><th>Got back / worth now</th><th>Profit</th><th style="text-align:left">Result</th></tr></thead>
        <tbody>${d.calls.map(row).join("")}</tbody></table></div>`
        : `<div class="empty">No trades yet. <a href="/stories">Pick a story</a> and bet YES or NO.</div>`}
    </section>`;
}

const ARENA_NAME = { brands: "BRANDS", food: "FOOD SAFETY", everyday: "FOOD & DRINK" };
const sectorTag = s => s && s !== "other" ? `<span class="sector">${esc(s)}</span>` : "";
const fmtTraffic = n => n >= 1e6 ? Math.round(n / 1e6) + "M+" : n >= 1e3 ? Math.round(n / 1e3) + "K+" : (n || "") + "";
const trendTag = t => t && t.term ? `<span class="trend" title="Google trending search">🔥 trending: “${esc(t.term)}”${t.traffic ? " · " + fmtTraffic(t.traffic) + " searches" : ""}</span>` : "";
const arenaTag = a => `<span class="arena ${esc(a || "food")}">${ARENA_NAME[a || "food"] || esc(a)}</span>`;
let BOARD_ARENA = (() => { try { return localStorage.getItem("st_arena") || "all"; } catch (e) { return "all"; } })();
function setArena(a) { BOARD_ARENA = a; try { localStorage.setItem("st_arena", a); } catch (e) {} board(); }

// ── BOARD ──
// ── SECTOR STOCKS ──
let SEC_SH = 10;
const SECTOR_HELP = "Price falls when drama rises: 100 = a normal day.";
function secSpark(h) {
  if (!h || h.length < 2) return "";
  const W = 180, H = 36, ps = h.map(p => p[1]), lo = Math.min(...ps, 95), hi = Math.max(...ps, 105);
  const x = i => i / (h.length - 1) * W, y = v => 2 + (1 - (v - lo) / (hi - lo || 1)) * (H - 4);
  const base = y(100);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:36px" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--s3)" stroke-dasharray="2 3"/>
    <polyline fill="none" stroke="${ps[ps.length - 1] < 100 ? "var(--red)" : "var(--green)"}" stroke-width="1.6" points="${ps.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}"/></svg>`;
}
async function sectorsPanel() {
  const el = $("#sectors"); if (!el) return;
  const q = ME ? "?user_id=" + encodeURIComponent(ME.id) : "";
  let d; try { d = await (await fetch("/api/sectors" + q)).json(); } catch (e) { el.innerHTML = ""; return; }
  const pos = Object.fromEntries(((d.me || {}).positions || []).map(p => [p.sector, p]));
  const card = x => {
    const p = pos[x.sector], c = x.change_24h, pc = x.price == null ? "var(--muted)" : x.price < 95 ? "var(--red)" : x.price > 105 ? "var(--green)" : "var(--text)";
    const drv = (x.drivers || [])[0];
    return `<div class="sec">
      <div class="row" style="display:flex;justify-content:space-between;gap:6px"><span class="nm">${esc(x.label)}</span>
        <span class="ch" style="color:${c == null ? "var(--muted)" : c < 0 ? "var(--red)" : "var(--green)"}">${c == null ? "" : (c < 0 ? "▼ " : "▲ +") + c.toFixed(1)}</span></div>
      <div class="px" style="color:${pc}">${x.price == null ? "—" : x.price.toFixed(1)}</div>
      ${secSpark(x.spark)}
      <div class="drv">${drv ? `drama: <a href="/story/${encodeURIComponent(drv.sid)}">${esc(drv.title || "")}</a>` : x.sector === "food safety" ? "drama: recalls &amp; outbreaks (FSNI)" : "no drama right now"}</div>
      <div class="drv">${x.sell_pct == null ? "no trades yet" : `crowd: <b style="color:${x.sell_pct > 55 ? "var(--red)" : x.sell_pct < 45 ? "var(--green)" : "var(--text)"}">${Math.round(x.sell_pct)}% selling</b> · ${x.traders} trader${x.traders === 1 ? "" : "s"}`}</div>
      ${p ? `<div class="drv" style="color:var(--text)">You: <b>${p.side === "LONG" ? "bought" : "sold"} ${p.shares}</b> @ ${p.entry} · <b class="${p.pnl >= 0 ? "down" : "up"}">${sgn(p.pnl)} cr</b></div>` : ""}
      ${ME && x.price != null ? `<div class="btns"><button class="b" onclick="secTrade('${esc(x.sector)}','BUY')">BUY · calm</button><button class="s" onclick="secTrade('${esc(x.sector)}','SELL')">SELL · trouble</button></div>` : ""}
    </div>`;
  };
  el.innerHTML = `<div class="ph"><span class="lbl">Sector stocks · prices fall when drama rises</span>
      <span class="mono" style="font-size:10px;color:var(--muted)">${ME && d.me ? `your credits ${cr(d.me.credits)}` : "100 = a normal day"}</span></div>
    <div class="secs">${d.sectors.map(card).join("")}</div>
    <div class="sec-bar">${ME ? `<label for="sec-sh">Shares per trade</label><input id="sec-sh" type="number" min="1" max="${d.max_shares}" value="${SEC_SH}" oninput="SEC_SH=+this.value">
      <span>Buy = you expect calm. Sell = you expect trouble (or you sell what you hold). Hold as long as you like.</span><span class="tp-msg" id="sec-msg"></span>`
      : `<span>Log in on any story page to trade sectors. You start with 10,000 credits.</span>`}</div>`;
}
async function secTrade(sector, action) {
  const sh = Math.max(1, SEC_SH | 0), m = $("#sec-msg");
  const r = await fetch("/api/sectors/trade", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: ME.id, sector, action, shares: sh }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (m) { m.className = "tp-msg err"; m.textContent = d.detail || "Could not trade"; } return; }
  await sectorsPanel();
  const m2 = $("#sec-msg"); if (m2) { m2.className = "tp-msg"; m2.textContent = `${action === "BUY" ? "Bought" : "Sold"} ${d.shares} at ${d.price.toFixed(2)} · credits ${cr(d.balance)}`; }
}

// ── MODERATORS: only what players reported ──
async function reportedPosts() {
  const el = $("#reported"); if (!el || !IS_MOD || !ME) return;
  let d; try { const r = await fetch("/api/moderation/reported?user_id=" + encodeURIComponent(ME.id)); if (!r.ok) return; d = await r.json(); } catch (e) { return; }
  if (!d.posts.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="ph"><span class="lbl">⚑ Reported by players · moderators</span><span class="tag">${d.posts.length}</span></div>
    <div class="list" style="padding:0 14px 8px">${d.posts.map(p => `<div class="li"><a href="/story/${encodeURIComponent(p.sid)}">${esc(p.title)}</a>
      <div style="font-size:13px">“${esc(p.body)}”</div>
      <div class="m"><span>${esc(p.name)}</span><span>${when(p.ts)}</span><b class="up">⚑ ${p.reports}</b>${p.held ? "<span>hidden until you decide</span>" : ""}
        <button class="btn ghost" onclick="modAct(${p.id},'delete')">DELETE</button><button class="btn ghost" onclick="modAct(${p.id},'restore')">KEEP</button></div></div>`).join("")}</div>`;
}
async function modAct(id, action) {
  await fetch(`/api/stories/comments/${id}/action`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user_id: ME.id, action }) });
  reportedPosts();
}

// ── SPOT IT FIRST ──
let SPOTS = null, SPOT_FORM = false;
function spottedBadge(s) {
  if (!SPOTS || !s.company) return "";
  const c = SPOTS.cards.find(c => c.status === "CONFIRMED" && c.confirmed_by && (c.confirmed_by.sid === s.sid || (c.brand || "").toLowerCase() === s.company.toLowerCase()));
  if (!c) return "";
  const lead = Math.max(...c.won.map(w => w.lead_s || 0), 0);
  return `<div class="spot-badge">🔍 spotted by ${c.won.length} player${c.won.length === 1 ? "" : "s"}${lead ? " · " + leadTxt(lead) : ""}</div>`;
}
function spotForm(brand) {
  if (!ME) return loginHtml("Log in to spot trouble.");
  const R = SPOTS.rules;
  if (SPOTS.open >= R.max_open) return `<div class="note">You have ${R.max_open} open spots. Wait until one is decided.</div>`;
  return `<div class="spot-form">
    <input id="sp-brand" list="sp-brands" placeholder="Brand, e.g. Chipotle" value="${esc(brand || "")}" ${brand ? "readonly" : ""} autocomplete="off">
    <datalist id="sp-brands">${SPOTS.brands.map(b => `<option value="${esc(b.name)}">`).join("")}</datalist>
    <textarea id="sp-why" maxlength="600" placeholder="What's brewing? e.g. people on TikTok are furious about smaller bowls, a petition is growing…"></textarea>
    <input id="sp-link" maxlength="500" placeholder="Source link (optional): https://…">
    <div class="tp-row"><button class="btn" id="sp-go" onclick="sendSpot()">🔍 SPOT IT</button>
      ${brand ? "" : `<button class="btn ghost" onclick="SPOT_FORM=false;$('#spots').innerHTML=spotsSection()">CANCEL</button>`}
      <span class="tp-msg err" id="sp-msg"></span></div>
    <div class="note" style="padding:0">Wins if a real story about this brand appears within ${R.days} days: ${R.base} credits + ${R.per_day} for every day early (+${R.first_bonus} if you're first). Nothing to lose. No campaigns: don't start what you spot.</div>
  </div>`;
}
function spotCard(c) {
  const left = c.closes - Date.now() / 1000;
  const st = c.status === "CONFIRMED" ? `<span class="pill LISTED">CONFIRMED</span>` : c.status === "EXPIRED" ? `<span class="pill CLOSED">NOTHING HAPPENED</span>` : `<span class="pill spot">🔍 SPOTTED</span>`;
  return `<a class="card spot-card" href="/story/${encodeURIComponent(c.sid)}">
    <div class="card-top">${st}</div>
    <div class="card-title">${esc(c.title)}</div>
    <div class="m">${c.spotters} player${c.spotters === 1 ? "" : "s"} · first spotted ${when(c.first_ts)}
      ${c.status === "SPOTTED" ? ` · ${Math.max(0, Math.ceil(left / 86400))} days left` : c.confirmed_by ? ` · news: ${esc((c.confirmed_by.title || "").slice(0, 60))}` : ""}</div>
    ${c.mine ? `<div class="m"><b>You spotted it</b>${c.mine.payout ? ` · <b class="down">+${Math.round(c.mine.payout)} cr</b>` : ""}</div>` : ""}
  </a>`;
}
function spotsSection() {
  if (!SPOTS) return "";
  const open = SPOTS.cards.filter(c => c.status === "SPOTTED").sort((a, b) => b.spotters - a.spotters || b.first_ts - a.first_ts);
  const done = SPOTS.cards.filter(c => c.status !== "SPOTTED");
  const big = open.filter(c => c.spotters >= 2).concat(done), small = open.filter(c => c.spotters < 2);
  const row = c => `<a class="spot-row" href="/story/${encodeURIComponent(c.sid)}"><b>${esc(c.brand)}</b><span>${when(c.first_ts)}</span>
      <span>${Math.max(0, Math.ceil((c.closes - Date.now() / 1000) / 86400))} days left</span>${c.mine ? "<span>· yours</span>" : ""}<span class="go">spot it too ›</span></a>`;
  return `<div class="ph"><span class="lbl">🔍 Spotted by players · before the news</span>
      ${SPOT_FORM ? "" : `<button class="btn" onclick="SPOT_FORM=true;$('#spots').innerHTML=spotsSection();$('#sp-brand').focus()">🔍 SPOT TROUBLE</button>`}</div>
    ${SPOT_FORM ? spotForm() : ""}
    ${big.length ? `<div class="cards">${big.map(spotCard).join("")}</div>` : ""}
    ${small.length ? `<div class="spot-list"><div class="lbl">Spotted by one player · join if you see it too</div>${small.map(row).join("")}</div>` : ""}
    ${!big.length && !small.length ? `<div class="note">Nothing spotted yet. Seen anger building at a brand that the news hasn't caught? Be the first to spot it.</div>` : ""}`;
}
async function sendSpot() {

  const d = await r.json().catch(() => ({}));

    $("#sp-msg").innerHTML = esc(m || "Could not save") + (det.story ? ` <a href="/story/${encodeURIComponent(det.story)}">Open that story ›</a>` : "");
    return;

}

    : `Newest article ${age.toFixed(1)}h old — the score is fading (about 1.2% of the subtotal per hour, down to 30%).`;
  const quiet = b.quiet_at_close != null ? `<div class="bd-note">If <b>no new coverage</b> arrives: about <b>${b.quiet_in_12h.toFixed(1)}</b> in 12h and <b>${b.quiet_at_close.toFixed(1)}</b> when the window closes. New articles, outlets or regions push it above that.</div>` : "";
  return `<section class="panel">

      <div class="bd-note">${freshTxt}</div>

    </div></section>`;
}

function fmtViews(n) {

function preview(side, action, units) {      // same formula as the server
  const p0 = MK.price, move = MK.impact * units;
  const up = (side === "GROW") === (action === "OPEN");
  const mid = up ? p0 + move / 2 : p0 - move / 2;
  return (side === "GROW" ? mid : 100 - mid) * units;
}
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function isLine() { return MK && MK.bet && ["line", "outlets", "cave", "tip"].includes(MK.bet.kind); }

function isCave() { return MK && MK.bet && MK.bet.kind === "cave"; }
function sideName(side, short) {
  if (!isLine()) return side;
  if (isTip()) return side === "GROW" ? (short ? "YES" : "YES, IT TIPS") : (short ? "NO" : "NO, IT FADES");
  if (isCave()) return side === "GROW" ? (short ? "YES" : "YES, THEY CAVE") : (short ? "NO" : "NO, THEY HOLD");
  if (isOutlets()) return side === "GROW" ? (short ? "YES" : "YES, IT SPREADS") : (short ? "NO" : "NO, IT STALLS");
  if (side === "GROW") return short ? "BEGINNING" : "JUST THE BEGINNING";
  const d = DAYS[new Date(MK.bet.closes_at * 1000).getDay()];

        <div class="m" style="display:flex;flex-direction:column;gap:2px"><span>${L.new_24h ? `🔥 +${L.new_24h} new outlet${L.new_24h === 1 ? "" : "s"} in the last 24h` : "no new outlets in the last 24h"}</span>
          ${L.early_until > Date.now() / 1000 ? `<span style="color:var(--amber)">⚡ early-call bonus: units bought in the next ${dur(L.early_until - Date.now() / 1000)} pay ${100 + L.early_bonus} if right</span>` : ""}</div>`
      : L ? `<div class="bd-note" style="font-size:13px">Will people <b>still be talking about this</b> when the window closes ${DAYS[new Date(L.closes_at * 1000).getDay()]} ${when(L.closes_at).split(",").pop()}, or is it <b>already dying</b>?</div>` : ""}
      <div class="tp-prices">
        <div class="tp-side grow"><span class="lbl"><b>${sideName("GROW")}</b></span><span class="tp-price">${L ? Math.round(MK.price) + "%" : MK.price.toFixed(1)}</span>
          <span class="tp-pays">${L && isTip() ? `Wins if the story <b>tips</b> before the close. Pays 100 per unit.` : L && isCave() ? `Wins if the brand <b>backs down</b> before the deadline. Pays 100 per unit.` : L && isOutlets() ? `Wins if <b>${L.target} or more</b> outlets cover it by the close. Pays 100 per unit.` : L ? `Wins if the story ends <b>above ${L.line.toFixed(1)}</b> — more coverage than a normal fade. Pays 100 per unit.` : "Pays the final score. Wins if the story ends bigger than this."}</span></div>
        <div class="tp-side fade"><span class="lbl"><b>${sideName("FADE")}</b></span><span class="tp-price">${L ? (100 - Math.round(MK.price)) + "%" : MK.fade_price.toFixed(1)}</span>
          <span class="tp-pays">${L && isTip() ? `Wins if it <b>fades</b> without tipping. Pays 100 per unit.` : L && isCave() ? `Wins if the brand <b>holds firm</b> all week. Pays 100 per unit.` : L && isOutlets() ? `Wins if it stays <b>below ${L.target}</b> outlets. Pays 100 per unit.` : L ? `Wins if the story ends <b>at or below ${L.line.toFixed(1)}</b> — it fizzles out. Pays 100 per unit.` : "Pays 100 − final score. Wins if the story ends smaller."}</span></div>
      </div>
      <div class="tp-cost">${L && isTip() ? `Most stories fade, so YES usually starts low. Price = the chance it tips, in % and credits per unit · ${leanTxt}.` : L && isCave() ? `Most storms pass without the brand backing down, so YES starts around 25%. Price = the chance, in % and credits per unit · ${leanTxt}.` : L && isOutlets() ? `Outlets = different news sites covering the story; they only go up. Price = the chance it gets there, in % and credits per unit · ${leanTxt}.` : L ? `The line is where the story should end if it fades normally (score now ${MK.score.toFixed(1)}, expected at close ${L.expected.toFixed(1)}). Price = the chance, in % and credits per unit · ${leanTxt}.` : `Price = score now ${MK.score.toFixed(1)} · ${leanTxt}.`} Each unit traded moves the price ${MK.impact} points.</div>
      ${!ME ? "" : MK.open ? `<div class="tp-row">
          <label class="lbl" for="tp-u">Units</label>
          <input id="tp-u" type="number" min="1" max="${MK.max_units}" value="${units}" oninput="UNITS=+this.value;renderCosts()">
          <button class="btn grow" id="b-g" ${canG ? "" : "disabled"} onclick="doTrade('GROW','OPEN')">${sideName("GROW", true)}</button>
          <button class="btn fade" id="b-f" ${canF ? "" : "disabled"} onclick="doTrade('FADE','OPEN')">${sideName("FADE", true)}</button>
        </div>
        <div class="tp-cost" id="tp-costs">${costLine(units)}</div>`
        : `<div class="note" style="padding:0">Trading is closed: ${esc(MK.closed_reason)}. Positions pay out when the window closes.</div>`}
      <div class="tp-msg" id="tp-msg"></div>
      ${held ? `<div class="tp-pos">
        <div class="kv"><span>Your position</span><b style="color:${held.side === "GROW" ? "var(--red)" : "var(--green)"}">${sideName(held.side)} · ${held.units} units</b></div>
        ${L ? `<div class="kv"><span>Pays if right</span><b>${cr(100 * held.units)}</b></div>` : ""}
        <div class="kv"><span>Average price</span><b>${held.avg?.toFixed(2)}</b></div>
        <div class="kv"><span>Cost · worth if closed now</span><b>${cr(held.cost)} · ${cr(held.value)}</b></div>
        <div class="kv"><span>Profit / loss now</span><b class="${held.pnl >= 0 ? "down" : "up"}">${sgn(held.pnl)} cr</b></div>
        ${MK.open ? `<div class="tp-row"><button class="btn ghost" onclick="doTrade('${held.side}','CLOSE',${held.units})">CLOSE ALL (${cr(preview(held.side, "CLOSE", held.units))})</button></div>` : ""}
      </div>` : ""}
      <div class="kv"><span>${MK.open ? "Trading stops" : "Trading stopped"} ${when(MK.trading_stops_at)}</span><span>${MK.traders} trader${MK.traders === 1 ? "" : "s"}</span></div>
      ${ME && MK.me ? `<div class="kv"><span>Your credits</span><b>${cr(MK.me.credits)}</b></div>` : ""}
    </div>`;
  }
  el.innerHTML = `<div class="ph"><span class="lbl">Trade this story</span><span class="tag">virtual credits</span></div>
    ${body}
    ${!ME && MK.status === "OPEN" ? loginHtml("Log in with your Quantara account to trade. You start with 10,000 credits.") : ""}
    ${MK.trades.length ? `<div class="ph" style="border-top:1px solid var(--border)"><span class="lbl">Recent trades</span></div>
      ${MK.trades.slice(0, 10).map(t => `<div class="tr"><span>${esc(t.name)}</span><span><b class="${t.side}">${t.action === "CLOSE" ? "closed " : ""}${sideName(t.side, true)}</b> ${t.units} @ ${t.price.toFixed(1)}</span><span>${ago(t.ts)}</span></div>`).join("")}` : ""}`;
}
function costLine(u) {
  const g = preview("GROW", "OPEN", u), f = preview("FADE", "OPEN", u);
  return isLine()
    ? `${u} × ${sideName("GROW", true)} costs ${cr(g)} → pays ${cr(100 * u)} if right · ${u} × ${sideName("FADE", true)} costs ${cr(f)} → pays ${cr(100 * u)} if right`
    : `GROW ${u} costs ${cr(g)} · FADE ${u} costs ${cr(f)}`;
}
function renderCosts() {
  const u = Math.max(1, Math.min(MK.max_units, UNITS | 0)), el = $("#tp-costs");
  if (el) el.textContent = costLine(u);
}
async function doTrade(side, action, units) {
  units = units || Math.max(1, Math.min(MK.max_units, UNITS | 0));
  document.querySelectorAll("#mkt .btn").forEach(b => b.disabled = true);
  const r = await fetch("/api/stories/trade", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: ME.id, sid: MK.sid, side, action, units }) });
  const d = await r.json().catch(() => ({}));
  await loadMarket(MK.sid);
  const m = $("#tp-msg");
  if (!r.ok) { m.className = "tp-msg err"; m.textContent = d.detail || "Trade failed"; return; }
  m.className = "tp-msg ok";
  m.textContent = `${action === "CLOSE" ? "Closed" : "Bought"} ${d.units} ${sideName(side, true)} at ${d.price.toFixed(2)} — ${action === "CLOSE" ? "received" : "paid"} ${cr(d.credits)}. Price now ${d.new_price.toFixed(1)}.`;
}

const m = location.pathname.match(/^\/story\/([^/]+)/);
const PATH = location.pathname;
const PAGE = m ? "story" : PATH.startsWith("/leaderboard") ? "lb" : PATH.startsWith("/history") ? "hist"
  : PATH.startsWith("/me") ? "me" : "board";
const RENDER = () => m ? (decodeURIComponent(m[1]).startsWith("sp") ? spotPage(decodeURIComponent(m[1])) : story(decodeURIComponent(m[1]))) : PAGE === "lb" ? leaderboardPage() : PAGE === "hist" ? historyPage()
  : PAGE === "me" ? mePage() : board();
loadRole().then(RENDER);
setInterval(() => { if (!document.hidden && !(m && (dcBusy() || REPLY_TO != null))) RENDER(); }, 5 * 60 * 1000);
setInterval(() => { if (!document.hidden && m && MK && document.activeElement?.id !== "tp-u") loadMarket(MK.sid); }, 30 * 1000);
setInterval(() => { if (!document.hidden && m && DC_SID && !dcBusy() && REPLY_TO == null) loadComments(DC_SID); }, 30 * 1000);
</script>

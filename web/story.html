<!doctype html>
<meta charset="utf-8">
<title>FSNI Stories — Quantara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1320; --s1: #151d2e; --s2: #1c2538; --s3: #232f47; --border: #2a3a55;
  --accent: #00c8f0; --green: #00e676; --red: #ff3d5a; --amber: #ffb300;
  --text: #f8faff; --muted: #7a95b8; --dim: #4a6080;
  --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
[hidden] { display: none !important }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px; overflow-x: hidden;
}
a { color: var(--accent) }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; background: rgba(15,19,32,.97); border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 3px }
.logo em { color: var(--muted); font-style: normal }
.nav { display: flex; gap: 8px; flex-wrap: wrap }
.nav a { font-family: var(--mono); font-size: 10px; color: var(--muted); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px }
.nav a:hover, .nav a.on { color: var(--accent); border-color: var(--accent) }
main { max-width: 1240px; margin: 0 auto; padding-top: 18px; display: grid; gap: 18px }
.lbl { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px }
.panel { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; min-width: 0 }
.panel > .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border) }
.panel > .pb { padding: 14px }
.rules { display: flex; gap: 10px 22px; flex-wrap: wrap; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.5 }
.rules b { color: var(--text); font-family: var(--mono); font-weight: 700 }
.empty { padding: 24px 14px; color: var(--muted); font-size: 13px; line-height: 1.6 }
.mono { font-family: var(--mono) }
.up { color: var(--red) } .down { color: var(--green) } .flat { color: var(--muted) }

/* status pills */
.pill { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 3px; white-space: nowrap }
.pill.LISTED { background: var(--amber); color: var(--bg) }
.pill.CLOSED { border: 1px solid var(--dim); color: var(--muted) }
.pill.MERGED { border: 1px solid var(--muted); color: var(--muted) }
.pill.WATCHING { border: 1px solid var(--accent); color: var(--accent) }
.tag { font-family: var(--mono); font-size: 9px; padding: 1px 5px; background: var(--s3); border-radius: 2px; color: var(--muted) }

/* board */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px }
.card { display: grid; gap: 8px; padding: 12px; background: var(--s2); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: inherit; min-width: 0 }
.card:hover { border-color: var(--accent) }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.4; text-wrap: balance }
.card-row { display: flex; align-items: end; justify-content: space-between; gap: 10px }
.card-score { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1 }
.card-score small { font-size: 11px; font-weight: 400; margin-left: 6px }
.card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap }
.bar { height: 4px; background: var(--s3); border-radius: 2px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }

/* story */
.s-head { display: grid; gap: 10px; padding: 16px 14px }
.s-title { font-size: 22px; font-weight: 700; line-height: 1.3; text-wrap: balance; max-width: 60ch }
.s-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.hero { display: flex; gap: 22px; flex-wrap: wrap; align-items: end; padding: 14px }
.hero-score { font-family: var(--mono); font-size: 48px; font-weight: 700; line-height: 1 }
.stat { display: grid; gap: 3px }
.stat .v { font-family: var(--mono); font-size: 16px; font-weight: 700 }
.window { padding: 0 14px 14px; display: grid; gap: 6px }
.window .bar { height: 6px }
.window-txt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); gap: 8px; flex-wrap: wrap }
.chart-wrap { padding: 8px 14px 14px; position: relative }
.chart-wrap svg { width: 100%; height: 240px; display: block }
.chart-tip { font-family: var(--mono); font-size: 10px; color: var(--muted); min-height: 14px; margin-top: 4px }
.list { display: grid }
.li { display: grid; gap: 3px; padding: 10px 14px; border-bottom: 1px solid var(--border); min-width: 0 }
.li:last-child { border-bottom: none }
.li a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.4 }
.li a:hover { color: var(--accent) }
.li .m { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.outlets { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 14px }
.note { padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.6 }
.note b { color: var(--text) }
.side { display: grid; gap: 18px; min-width: 0 }
/* trading */
.tp { display: grid; gap: 12px; padding: 14px }
.tp-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tp-side { display: grid; gap: 6px; padding: 10px; border-radius: 6px; background: var(--s2); border: 1px solid var(--border) }
.tp-side.grow { border-color: rgba(255,61,90,.45) }
.tp-side.fade { border-color: rgba(0,230,118,.45) }
.tp-side .lbl b { color: var(--text) }
.tp-price { font-family: var(--mono); font-size: 22px; font-weight: 700 }
.tp-side.grow .tp-price { color: var(--red) }
.tp-side.fade .tp-price { color: var(--green) }
.tp-pays { font-size: 11px; color: var(--muted); line-height: 1.4 }
.tp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.tp-row input { width: 80px; padding: 7px 8px; font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px }
.btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 9px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--s3); color: var(--text); cursor: pointer }
.btn:disabled { opacity: .4; cursor: not-allowed }
.btn.grow { background: var(--red); border-color: var(--red); color: #fff }
.btn.fade { background: transparent; border-color: var(--green); color: var(--green) }
.btn.ghost { background: transparent; color: var(--muted) }
.tp-cost { font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tp-msg { font-size: 12px; min-height: 16px }
.tp-msg.err { color: var(--red) } .tp-msg.ok { color: var(--green) }
.tp-pos { display: grid; gap: 4px; padding: 10px; border-radius: 6px; background: var(--s2) }
.kv { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.kv b { color: var(--text) }
.login { display: grid; gap: 8px; padding: 14px }
.login input { padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; min-width: 0 }
.tr { display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tr:last-child { border-bottom: none }
.tr b.GROW { color: var(--red) } .tr b.FADE { color: var(--green) }
.mine { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px }
</style>

<header>
  <div class="logo">QUANTARA<em>/</em>STORIES</div>
  <nav class="nav">
    <a href="/narrative">← FSNI</a>
    <a href="/stories" id="nav-board">Listed stories</a>
    <a href="/">Exchange</a>
  </nav>
</header>

<main id="main"><div class="empty">Loading…</div></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : null;
function ago(ts) {
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function dur(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${String(m).padStart(2, "0")}m`;
}
function when(ts) {
  if (!ts) return "—";
  return new Date(ts * 1000).toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function scoreColor(v) { return v >= 60 ? "var(--red)" : v >= 30 ? "var(--amber)" : "var(--green)"; }
function delta(d) {
  if (d == null) return "";
  const c = d > 0.5 ? "up" : d < -0.5 ? "down" : "flat";
  const a = d > 0.5 ? "▲" : d < -0.5 ? "▼" : "●";
  return `<span class="${c}">${a} ${d >= 0 ? "+" : ""}${d.toFixed(1)} / 3h</span>`;
}
function spark(pts, w = 120, h = 30) {
  if (!pts || pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const xy = pts.map(p => [((p[0] - t0) / Math.max(1, t1 - t0)) * w, h - 2 - (Math.min(100, p[1]) / 100) * (h - 4)]);
  const y30 = h - 2 - 0.3 * (h - 4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y30}" y2="${y30}" stroke="var(--dim)" stroke-dasharray="2 3"/>
    <polyline fill="none" stroke="var(--amber)" stroke-width="1.6" points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}

// ── ACCOUNT (same login as the exchange and the FSNI page) ──
const ME = (() => { try { const id = localStorage.getItem("q_user_id"); return id ? { id, name: localStorage.getItem("q_username") || "" } : null; } catch (e) { return null; } })();
function loginHtml(why) {
  return `<div class="login"><div class="note" style="padding:0">${esc(why)}</div>
    <input id="lg-u" placeholder="Username" autocomplete="username">
    <input id="lg-p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="tp-row"><button class="btn" onclick="doLogin()">LOG IN</button><span class="tp-msg err" id="lg-msg"></span></div></div>`;
}
async function doLogin() {
  const r = await fetch("/api/login_pw", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("#lg-u").value, password: $("#lg-p").value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("#lg-msg").textContent = d.detail || "Login failed"; return; }
  try { localStorage.setItem("q_user_id", String(d.user_id)); localStorage.setItem("q_username", d.name); } catch (e) {}
  location.reload();
}
const cr = n => n == null ? "—" : Math.round(n).toLocaleString("en") + " cr";
const sgn = n => (n >= 0 ? "+" : "") + Math.round(n).toLocaleString("en");

// ── BOARD ──
async function board() {
  document.title = "Listed Stories — Quantara";
  $("#nav-board").classList.add("on");
  let d;
  try { d = await (await fetch("/api/narrative/listed")).json(); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load stories.</div>`; return; }
  const open = d.stories.filter(s => s.status === "LISTED");
  const closed = d.stories.filter(s => s.status === "CLOSED");
  const r = d.rules;
  const card = s => {
    const isOpen = s.status === "LISTED";
    const left = s.closes_at - d.now, full = r.window_h * 3600;
    const v = isOpen ? s.score : s.final_score;
    return `<a class="card" href="/story/${encodeURIComponent(s.sid)}">
      <div class="card-top"><span class="pill ${s.status}">${s.status}</span>
        ${(s.regions || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}
        ${(s.categories || []).slice(0, 2).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-row">
        <div><div class="lbl">${isOpen ? "Score now" : "Final score"}</div>
          <div class="card-score" style="color:${scoreColor(v || 0)}">${(v ?? 0).toFixed(1)}
            <small class="mono" style="color:var(--muted)">listed at ${s.list_score.toFixed(1)}</small></div></div>
        ${spark(s.spark)}
      </div>
      ${isOpen ? `<div class="card-meta"><span>GROW <b style="color:var(--red)">${s.price.toFixed(1)}</b></span><span>FADE <b style="color:var(--green)">${(100 - s.price).toFixed(1)}</b></span><span>${s.trading_open ? "trading open" : "trading stopped"}</span></div>` : ""}
      ${isOpen ? `<div class="bar"><i style="width:${(100 * (1 - left / full)).toFixed(1)}%"></i></div>` : ""}
      <div class="card-meta"><span>${s.outlets} outlets</span>
        <span>${isOpen ? "closes in " + dur(left) : "closed " + ago(s.closed_at)}</span>
        <span>${isOpen ? (s.in_news ? "in the news" : "fading — no new coverage") : "peak " + (s.peak_score ?? 0).toFixed(1)}</span></div>
    </a>`;
  };
  $("#main").innerHTML = `
    <section class="panel">
      <div class="ph"><span class="lbl">How listing works</span></div>
      <div class="rules">
        <span>A story is <b>listed</b> when its story score reaches <b>${r.score}</b> with <b>${r.outlets}+</b> outlets.</span>
        <span>It stays listed for <b>${r.window_h}h</b>, then closes on its <b>final score</b>.</span>
        <span>Scores come only from outside news sources — nothing on this site moves them.</span>
        <span><b>GROW</b> pays the final score per unit, <b>FADE</b> pays 100 − final. Everyone starts with <b>10,000</b> credits.</span>
      </div>
    </section>
    <section class="panel" id="mine"></section>
    <section class="panel">
      <div class="ph"><span class="lbl">Listed now</span><span class="tag">${open.length}</span></div>
      ${open.length ? `<div class="cards">${open.map(card).join("")}</div>`
        : `<div class="empty">No story is listed right now. The highest scores are on the <a href="/narrative">FSNI page</a> — click any headline to follow its score.</div>`}
    </section>
    <section class="panel">
      <div class="ph"><span class="lbl">Closed · last 14 days</span><span class="tag">${closed.length}</span></div>
      ${closed.length ? `<div class="cards">${closed.map(card).join("")}</div>` : `<div class="empty">No closed stories yet.</div>`}
    </section>`;
  myStories();
}
async function myStories() {
  const el = $("#mine"); if (!el) return;
  if (!ME) { el.innerHTML = `<div class="ph"><span class="lbl">My stories</span></div>${loginHtml("Log in with your Quantara account to trade stories with virtual credits.")}`; return; }
  let d; try { d = await (await fetch("/api/stories/account/" + encodeURIComponent(ME.id))).json(); } catch (e) { return; }
  const open = d.positions.filter(p => p.status === "OPEN"), done = d.positions.filter(p => p.status !== "OPEN").slice(0, 8);
  const row = p => `<div class="li"><a href="/story/${encodeURIComponent(p.sid)}">${esc(p.title)}</a>
    <div class="m"><b class="mono" style="color:${p.side === "GROW" ? "var(--red)" : "var(--green)"}">${p.side}</b><span>${p.units} units</span>
    ${p.status === "OPEN" ? `<span>cost ${cr(p.cost)}</span><span>worth ${cr(p.value)}</span>` : `<span>${p.status.toLowerCase()}${p.final != null && p.status === "SETTLED" ? " at " + p.final.toFixed(1) : ""}</span>`}
    <span class="${p.pnl >= 0 ? "down" : "up"}">${sgn(p.pnl)} cr</span></div></div>`;
  el.innerHTML = `<div class="ph"><span class="lbl">My stories · ${esc(ME.name)}</span><span class="tag">${open.length} open</span></div>
    <div class="mine">
      <div class="stat"><span class="lbl">Credits</span><span class="v">${cr(d.credits)}</span></div>
      <div class="stat"><span class="lbl">Open positions (if closed now)</span><span class="v">${cr(d.open_value)}</span></div>
      <div class="stat"><span class="lbl">Net worth</span><span class="v">${cr(d.net_worth)}</span></div>
      <div class="stat"><span class="lbl">Profit / loss</span><span class="v ${d.pnl >= 0 ? "down" : "up"}">${sgn(d.pnl)} cr</span></div>
    </div>
    ${open.length || done.length ? `<div class="list">${open.map(row).join("")}${done.map(row).join("")}</div>`
      : `<div class="note">No positions yet. Open a listed story and take a GROW or FADE position.</div>`}`;
}

// ── STORY ──
function chart(d) {
  const pts = d.points || [];
  if (pts.length < 2) return `<div class="empty">Score history builds up with each reading (every 15 minutes).</div>`;
  const W = 760, H = 240, L = 32, R = 10, T = 10, B = 22;
  const t0 = Math.min(pts[0][0], d.listed_at || pts[0][0]);
  const t1 = Math.max(pts[pts.length - 1][0], d.status === "LISTED" ? d.closes_at : 0);
  const X = t => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const Y = v => T + (1 - Math.min(100, v) / 100) * (H - T - B);
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const area = `${X(pts[0][0]).toFixed(1)},${Y(0)} ${line} ${X(pts[pts.length - 1][0]).toFixed(1)},${Y(0)}`;
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--s3)"/>
    <text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="var(--dim)" font-family="Space Mono, monospace">${v}</text>`).join("");
  const thr = d.rules.score;
  let marks = `<line x1="${L}" x2="${W - R}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="var(--amber)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W - R}" y="${Y(thr) - 4}" text-anchor="end" font-size="9" fill="var(--amber)" font-family="Space Mono, monospace">listing line ${thr}</text>`;
  if (d.listed_at) marks += `<line x1="${X(d.listed_at)}" x2="${X(d.listed_at)}" y1="${T}" y2="${H - B}" stroke="var(--amber)" opacity=".8"/>
    <text x="${X(d.listed_at) + 4}" y="${T + 9}" font-size="9" fill="var(--amber)" font-family="Space Mono, monospace">listed</text>`;
  if (d.closes_at) marks += `<line x1="${X(d.closes_at)}" x2="${X(d.closes_at)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${X(d.closes_at) - 4}" y="${T + 9}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Space Mono, monospace">${d.status === "CLOSED" ? "closed" : "closes"}</text>`;
  const tl = [t0, (t0 + t1) / 2, t1].map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][i]}" font-size="9" fill="var(--dim)" font-family="Space Mono, monospace">${esc(when(t))}</text>`).join("");
  window.__pts = pts; window.__X = X; window.__Y = Y; window.__W = W;
  return `<svg id="sc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Story score over time">
    ${grid}${marks}
    <polygon points="${area}" fill="var(--amber)" opacity=".08"/>
    <polyline points="${line}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line id="sc-h" y1="${T}" y2="${H - B}" stroke="var(--text)" opacity="0" vector-effect="non-scaling-stroke"/>
    <circle id="sc-d" r="4" fill="var(--amber)" opacity="0"/>
    ${tl}
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="sc-hit"/>
  </svg><div class="chart-tip" id="sc-tip">Hover the chart for values</div>`;
}
function hookChart() {
  const svg = document.getElementById("sc"); if (!svg) return;
  const pts = window.__pts, X = window.__X, Y = window.__Y, W = window.__W;
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let i = 0, best = 1e9;
    pts.forEach((p, k) => { const dx = Math.abs(X(p[0]) - x); if (dx < best) { best = dx; i = k; } });
    const h = document.getElementById("sc-h"), c = document.getElementById("sc-d");
    h.setAttribute("x1", X(pts[i][0])); h.setAttribute("x2", X(pts[i][0])); h.setAttribute("opacity", ".5");
    c.setAttribute("cx", X(pts[i][0])); c.setAttribute("cy", Y(pts[i][1])); c.setAttribute("opacity", "1");
    document.getElementById("sc-tip").textContent = `▸ score ${pts[i][1].toFixed(1)} · ${when(pts[i][0])}`;
  });
  svg.addEventListener("mouseleave", () => {
    document.getElementById("sc-h").setAttribute("opacity", "0");
    document.getElementById("sc-d").setAttribute("opacity", "0");
    document.getElementById("sc-tip").textContent = "Hover the chart for values";
  });
}
function art(a) {
  const u = safeUrl(a.url);
  return `<div class="li">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : `<span>${esc(a.title)}</span>`}
    <div class="m"><span>${esc(a.source || "")}</span>${a.region ? `<span class="tag">${esc(a.region)}</span>` : ""}<span>${when(a.ts)}</span></div></div>`;
}

async function story(sid) {
  let d;
  try {
    const r = await fetch("/api/narrative/story/" + encodeURIComponent(sid));
    if (r.status === 404) { $("#main").innerHTML = `<div class="empty">This story is no longer tracked. Stories that were never listed drop out once they leave the news. <a href="/stories">See listed stories</a>.</div>`; return; }
    d = await r.json();
  } catch (e) { $("#main").innerHTML = `<div class="empty">Could not load the story.</div>`; return; }
  document.title = d.title.slice(0, 40) + " — Quantara";
  const isOpen = d.status === "LISTED", isClosed = d.status === "CLOSED";
  const v = isClosed ? d.final_score : d.score;
  const full = d.rules.window_h * 3600;
  const windowHtml = isOpen ? `<div class="window">
      <div class="bar"><i style="width:${(100 * Math.min(1, (d.now - d.listed_at) / full)).toFixed(1)}%"></i></div>
      <div class="window-txt"><span>listed ${when(d.listed_at)}</span><span>closes in ${dur(d.closes_at - d.now)}</span><span>${when(d.closes_at)}</span></div></div>`
    : d.status === "MERGED" ? `<div class="note">This was the same event as another listed story, headlined differently. It was merged into <a href="/story/${encodeURIComponent(d.merged_into)}">that story</a>, which carries on from here.</div>`
    : isClosed ? `<div class="window"><div class="window-txt"><span>listed ${when(d.listed_at)}</span><span>closed ${when(d.closed_at)}</span></div></div>`
    : `<div class="note">Not listed yet. A story lists at score <b>${d.rules.score}</b> with <b>${d.rules.outlets}+</b> outlets — this one is at <b>${(d.score || 0).toFixed(1)}</b> with <b>${d.outlets}</b> outlet${d.outlets === 1 ? "" : "s"}.</div>`;
  const origin = (d.origin || []);
  const originHtml = origin.length ? `<div class="note">First picked up ${when(d.first_seen || origin[0].ts)} — the earliest coverage we have:</div>
      <div class="list">${origin.map(art).join("")}</div>` : `<div class="empty">No articles stored.</div>`;
  const rel = d.related || [];
  $("#main").innerHTML = `
    <section class="panel">
      <div class="s-head">
        <div class="s-sub"><span class="pill ${d.status}">${d.status}</span>
          ${(d.regions || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}
          ${(d.categories || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}
          ${(d.hazards || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}
          <span class="mono" style="font-size:10px">id ${esc(d.sid)}</span></div>
        <h1 class="s-title">${esc(d.title)}</h1>
      </div>
    </section>
    <div class="grid2">
      <div style="display:grid;gap:18px;min-width:0">
        <section class="panel">
          <div class="ph"><span class="lbl">Story score</span><span class="mono" style="font-size:10px;color:var(--muted)">${d.in_news ? "in the news" : "no new coverage — score fading"}</span></div>
          <div class="hero">
            <div class="stat"><span class="lbl">${isClosed ? "Final score" : "Score now"}</span>
              <span class="hero-score" style="color:${scoreColor(v || 0)}">${(v ?? 0).toFixed(1)}</span>
              <span class="mono" style="font-size:11px">${delta(d.delta)}</span></div>
            ${d.list_score != null ? `<div class="stat"><span class="lbl">Listed at</span><span class="v">${d.list_score.toFixed(1)}</span></div>` : ""}
            ${d.peak_score != null ? `<div class="stat"><span class="lbl">Peak</span><span class="v">${d.peak_score.toFixed(1)}</span></div>` : ""}
            <div class="stat"><span class="lbl">Outlets</span><span class="v">${d.outlets}</span></div>
            <div class="stat"><span class="lbl">Articles</span><span class="v">${d.article_count ?? d.articles.length}</span></div>
          </div>
          ${windowHtml}
          <div class="chart-wrap">${chart(d)}</div>
        </section>
        <section class="panel">
          <div class="ph"><span class="lbl">Coverage</span><span class="tag">${d.articles.length}</span></div>
          <div class="list">${d.articles.map(art).join("") || `<div class="empty">No articles stored.</div>`}</div>
          ${d.status === "WATCHING" ? `<div class="note">Only the lead article is shown until the story is listed — from then on every article is kept.</div>` : ""}
        </section>
      </div>
      <div class="side">
        ${d.status === "WATCHING" ? "" : `<section class="panel" id="mkt"></section>`}
        <section class="panel"><div class="ph"><span class="lbl">How it started</span></div>${originHtml}</section>
        ${(d.outlet_names || []).length ? `<section class="panel"><div class="ph"><span class="lbl">Outlets</span><span class="tag">${d.outlet_names.length}</span></div>
          <div class="outlets">${d.outlet_names.map(o => `<span class="tag">${esc(o)}</span>`).join("")}</div></section>` : ""}
        <section class="panel"><div class="ph"><span class="lbl">Related stories</span></div>
          ${rel.length ? `<div class="list">${rel.map(r => `<div class="li"><a href="/story/${encodeURIComponent(r.sid)}">${esc(r.title)}</a>
            <div class="m"><span class="pill ${r.status}">${r.status}</span><span>score ${(r.score ?? 0).toFixed(1)}</span>
            ${r.same_hazard ? "<span>same hazard</span>" : ""}${r.shared.length ? `<span>shares: ${esc(r.shared.join(", "))}</span>` : ""}</div></div>`).join("")}</div>`
            : `<div class="empty">No related stories right now.</div>`}
        </section>
        <section class="panel"><div class="ph"><span class="lbl">How the score works</span></div>
          <div class="note">0–100, from outside news only: <b>reach</b> (outlets, 45%), <b>regions</b> (15%), <b>severity</b> (deaths, hospitalisations, Class I — 20%), <b>momentum</b> (new articles in 12h — 20%), times <b>freshness</b>, which fades once coverage stops.</div>
        </section>
      </div>
    </div>`;
  hookChart();
  if (d.status !== "WATCHING") loadMarket(d.sid);
}

// ── TRADING ──
let MK = null, UNITS = 10;
async function loadMarket(sid) {
  const q = ME ? "?user_id=" + encodeURIComponent(ME.id) : "";
  try { const r = await fetch("/api/stories/market/" + encodeURIComponent(sid) + q); if (!r.ok) return; MK = await r.json(); MK.sid = sid; }
  catch (e) { return; }
  renderMarket();
}
function preview(side, action, units) {      // same formula as the server
  const p0 = MK.price, move = MK.impact * units;
  const up = (side === "GROW") === (action === "OPEN");
  const mid = up ? p0 + move / 2 : p0 - move / 2;
  return (side === "GROW" ? mid : 100 - mid) * units;
}
function renderMarket() {
  const el = $("#mkt"); if (!el || !MK) return;
  const pos = ((MK.me || {}).positions || []).filter(p => p.status === "OPEN");
  const held = pos[0];
  const lean = MK.offset;
  const leanTxt = Math.abs(lean) < 0.05 ? "no crowd lean yet" : `crowd lean ${lean > 0 ? "+" : ""}${lean.toFixed(1)}`;
  let body;
  if (MK.status !== "OPEN") {
    const mine = (MK.me || {}).positions || [];
    body = `<div class="note">${MK.status === "SETTLED" ? `Settled at final score <b>${(MK.final ?? 0).toFixed(1)}</b>. GROW paid ${(MK.final ?? 0).toFixed(1)} per unit, FADE ${(100 - (MK.final ?? 0)).toFixed(1)}.`
      : "This story was merged into another listing. All positions were refunded."}</div>
      ${mine.map(p => `<div class="tp" style="padding-top:0"><div class="tp-pos">
        <div class="kv"><span>${p.side} · ${p.units || ""} ${p.units ? "units" : ""}</span><b>${p.status}</b></div>
        <div class="kv"><span>Paid out</span><b>${cr(p.payout)}</b></div>
        <div class="kv"><span>Profit / loss</span><b class="${p.pnl >= 0 ? "down" : "up"}">${sgn(p.pnl)} cr</b></div></div></div>`).join("")}`;
  } else {
    const units = Math.max(1, Math.min(MK.max_units, UNITS | 0));
    const gCost = preview("GROW", "OPEN", units), fCost = preview("FADE", "OPEN", units);
    const canG = MK.open && ME && !(held && held.side === "FADE");
    const canF = MK.open && ME && !(held && held.side === "GROW");
    body = `<div class="tp">
      <div class="tp-prices">
        <div class="tp-side grow"><span class="lbl"><b>GROW</b> · per unit</span><span class="tp-price">${MK.price.toFixed(1)}</span>
          <span class="tp-pays">Pays the final score. Wins if the story ends bigger than this.</span></div>
        <div class="tp-side fade"><span class="lbl"><b>FADE</b> · per unit</span><span class="tp-price">${MK.fade_price.toFixed(1)}</span>
          <span class="tp-pays">Pays 100 − final score. Wins if the story ends smaller.</span></div>
      </div>
      <div class="tp-cost">Price = score now ${MK.score.toFixed(1)} · ${leanTxt}. Each unit traded moves the price ${MK.impact} points.</div>
      ${!ME ? "" : MK.open ? `<div class="tp-row">
          <label class="lbl" for="tp-u">Units</label>
          <input id="tp-u" type="number" min="1" max="${MK.max_units}" value="${units}" oninput="UNITS=+this.value;renderCosts()">
          <button class="btn grow" id="b-g" ${canG ? "" : "disabled"} onclick="doTrade('GROW','OPEN')">GROW</button>
          <button class="btn fade" id="b-f" ${canF ? "" : "disabled"} onclick="doTrade('FADE','OPEN')">FADE</button>
        </div>
        <div class="tp-cost" id="tp-costs">GROW ${units} costs ${cr(gCost)} · FADE ${units} costs ${cr(fCost)}</div>`
        : `<div class="note" style="padding:0">Trading is closed: ${esc(MK.closed_reason)}. Positions pay out when the window closes.</div>`}
      <div class="tp-msg" id="tp-msg"></div>
      ${held ? `<div class="tp-pos">
        <div class="kv"><span>Your position</span><b style="color:${held.side === "GROW" ? "var(--red)" : "var(--green)"}">${held.side} · ${held.units} units</b></div>
        <div class="kv"><span>Average price</span><b>${held.avg?.toFixed(2)}</b></div>
        <div class="kv"><span>Cost · worth if closed now</span><b>${cr(held.cost)} · ${cr(held.value)}</b></div>
        <div class="kv"><span>Profit / loss now</span><b class="${held.pnl >= 0 ? "down" : "up"}">${sgn(held.pnl)} cr</b></div>
        ${MK.open ? `<div class="tp-row"><button class="btn ghost" onclick="doTrade('${held.side}','CLOSE',${held.units})">CLOSE ALL (${cr(preview(held.side, "CLOSE", held.units))})</button></div>` : ""}
      </div>` : ""}
      <div class="kv"><span>${MK.open ? "Trading stops" : "Trading stopped"} ${when(MK.trading_stops_at)}</span><span>${MK.traders} trader${MK.traders === 1 ? "" : "s"}</span></div>
      ${ME ? `<div class="kv"><span>Your credits</span><b>${cr(MK.me.credits)}</b></div>` : ""}
    </div>`;
  }
  el.innerHTML = `<div class="ph"><span class="lbl">Trade this story</span><span class="tag">virtual credits</span></div>
    ${body}
    ${!ME && MK.status === "OPEN" ? loginHtml("Log in with your Quantara account to trade. You start with 10,000 credits.") : ""}
    ${MK.trades.length ? `<div class="ph" style="border-top:1px solid var(--border)"><span class="lbl">Recent trades</span></div>
      ${MK.trades.slice(0, 10).map(t => `<div class="tr"><span>${esc(t.name)}</span><span><b class="${t.side}">${t.action === "CLOSE" ? "closed " : ""}${t.side}</b> ${t.units} @ ${t.price.toFixed(1)}</span><span>${ago(t.ts)}</span></div>`).join("")}` : ""}`;
}
function renderCosts() {
  const u = Math.max(1, Math.min(MK.max_units, UNITS | 0)), el = $("#tp-costs");
  if (el) el.textContent = `GROW ${u} costs ${cr(preview("GROW", "OPEN", u))} · FADE ${u} costs ${cr(preview("FADE", "OPEN", u))}`;
}
async function doTrade(side, action, units) {
  units = units || Math.max(1, Math.min(MK.max_units, UNITS | 0));
  document.querySelectorAll("#mkt .btn").forEach(b => b.disabled = true);
  const r = await fetch("/api/stories/trade", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: ME.id, sid: MK.sid, side, action, units }) });
  const d = await r.json().catch(() => ({}));
  await loadMarket(MK.sid);
  const m = $("#tp-msg");
  if (!r.ok) { m.className = "tp-msg err"; m.textContent = d.detail || "Trade failed"; return; }
  m.className = "tp-msg ok";
  m.textContent = `${action === "CLOSE" ? "Closed" : "Bought"} ${d.units} ${side} at ${d.price.toFixed(2)} — ${action === "CLOSE" ? "received" : "paid"} ${cr(d.credits)}. Price now ${d.new_price.toFixed(1)}.`;
}

const m = location.pathname.match(/^\/story\/([^/]+)/);
if (m) story(decodeURIComponent(m[1])); else board();
setInterval(() => { if (!document.hidden) (m ? story(decodeURIComponent(m[1])) : board()); }, 5 * 60 * 1000);
setInterval(() => { if (!document.hidden && m && MK && document.activeElement?.id !== "tp-u") loadMarket(MK.sid); }, 30 * 1000);
</script>

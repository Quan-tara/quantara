<!doctype html>
<meta charset="utf-8">
<title>FSNI Stories — Quantara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1320; --s1: #151d2e; --s2: #1c2538; --s3: #232f47; --border: #2a3a55;
  --accent: #00c8f0; --green: #00e676; --red: #ff3d5a; --amber: #ffb300;
  --text: #f8faff; --muted: #7a95b8; --dim: #4a6080;
  --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
[hidden] { display: none !important }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px; overflow-x: hidden;
}
a { color: var(--accent) }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; background: rgba(15,19,32,.97); border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 3px }
.logo em { color: var(--muted); font-style: normal }
.nav { display: flex; gap: 8px; flex-wrap: wrap }
.nav a { font-family: var(--mono); font-size: 10px; color: var(--muted); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px }
.nav a:hover, .nav a.on { color: var(--accent); border-color: var(--accent) }
main { max-width: 1240px; margin: 0 auto; padding-top: 18px; display: grid; gap: 18px }
.lbl { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px }
.panel { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; min-width: 0 }
.panel > .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border) }
.panel > .pb { padding: 14px }
.rules { display: flex; gap: 10px 22px; flex-wrap: wrap; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.5 }
.rules b { color: var(--text); font-family: var(--mono); font-weight: 700 }
.empty { padding: 24px 14px; color: var(--muted); font-size: 13px; line-height: 1.6 }
.mono { font-family: var(--mono) }
.up { color: var(--red) } .down { color: var(--green) } .flat { color: var(--muted) }

/* status pills */
.pill { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 3px; white-space: nowrap }
.pill.LISTED { background: var(--amber); color: var(--bg) }
.pill.CLOSED { border: 1px solid var(--dim); color: var(--muted) }
.pill.MERGED { border: 1px solid var(--muted); color: var(--muted) }
.pill.DELISTED { border: 1px solid var(--red); color: var(--red) }
.dl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.dl input { flex: 1 1 200px; min-width: 0; padding: 7px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 12px }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red) }
.pill.WATCHING { border: 1px solid var(--accent); color: var(--accent) }
.tag { font-family: var(--mono); font-size: 9px; padding: 1px 5px; background: var(--s3); border-radius: 2px; color: var(--muted) }

/* board */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px }
.card { display: grid; gap: 8px; padding: 12px; background: var(--s2); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: inherit; min-width: 0 }
.card:hover { border-color: var(--accent) }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.4; text-wrap: balance }
.card-row { display: flex; align-items: end; justify-content: space-between; gap: 10px }
.card-score { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1 }
.card-score small { font-size: 11px; font-weight: 400; margin-left: 6px }
.card-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap }
.bar { height: 4px; background: var(--s3); border-radius: 2px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }

/* story */
.s-head { display: grid; gap: 10px; padding: 16px 14px }
.s-title { font-size: 22px; font-weight: 700; line-height: 1.3; text-wrap: balance; max-width: 60ch }
.s-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.hero { display: flex; gap: 22px; flex-wrap: wrap; align-items: end; padding: 14px }
.hero-score { font-family: var(--mono); font-size: 48px; font-weight: 700; line-height: 1 }
.stat { display: grid; gap: 3px }
.stat .v { font-family: var(--mono); font-size: 16px; font-weight: 700 }
.window { padding: 0 14px 14px; display: grid; gap: 6px }
.window .bar { height: 6px }
.window-txt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); gap: 8px; flex-wrap: wrap }
.chart-wrap { padding: 8px 14px 14px; position: relative }
.chart-wrap svg { width: 100%; height: 240px; display: block }
.chart-tip { font-family: var(--mono); font-size: 10px; color: var(--muted); min-height: 14px; margin-top: 4px }
.list { display: grid }
.li { display: grid; gap: 3px; padding: 10px 14px; border-bottom: 1px solid var(--border); min-width: 0 }
.li:last-child { border-bottom: none }
.li a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.4 }
.li a:hover { color: var(--accent) }
.li .m { font-family: var(--mono); font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.outlets { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 14px }
.note { padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.6 }
.note b { color: var(--text) }
.side { display: grid; gap: 18px; min-width: 0 }
/* trading */
.tp { display: grid; gap: 12px; padding: 14px }
.tp-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tp-side { display: grid; gap: 6px; padding: 10px; border-radius: 6px; background: var(--s2); border: 1px solid var(--border) }
.tp-side.grow { border-color: rgba(255,61,90,.45) }
.tp-side.fade { border-color: rgba(0,230,118,.45) }
.tp-side .lbl b { color: var(--text) }
.tp-price { font-family: var(--mono); font-size: 22px; font-weight: 700 }
.tp-side.grow .tp-price { color: var(--red) }
.tp-side.fade .tp-price { color: var(--green) }
.tp-pays { font-size: 11px; color: var(--muted); line-height: 1.4 }
.tp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.tp-row input { width: 80px; padding: 7px 8px; font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px }
.btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 9px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--s3); color: var(--text); cursor: pointer }
.btn:disabled { opacity: .4; cursor: not-allowed }
.btn.grow { background: var(--red); border-color: var(--red); color: #fff }
.btn.fade { background: transparent; border-color: var(--green); color: var(--green) }
.btn.ghost { background: transparent; color: var(--muted) }
.tp-cost { font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tp-msg { font-size: 12px; min-height: 16px }
.tp-msg.err { color: var(--red) } .tp-msg.ok { color: var(--green) }
.tp-pos { display: grid; gap: 4px; padding: 10px; border-radius: 6px; background: var(--s2) }
.kv { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.kv b { color: var(--text) }
.login { display: grid; gap: 8px; padding: 14px }
.login input { padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; min-width: 0 }
.tr { display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--muted) }
.tr:last-child { border-bottom: none }
.tr b.GROW { color: var(--red) } .tr b.FADE { color: var(--green) }
/* discussion */
.dc-read { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--border) }
.dc-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--s3) }
.dc-bar i { display: block; height: 100% }
.dc-legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--muted) }
.dc-legend b { color: var(--text) }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle }
.v-REAL { background: var(--red) } .v-EXAGGERATED { background: var(--amber) } .v-HYPE { background: var(--accent) }
.dc-form { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border) }
.dc-form textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; font: 13px/1.5 var(--sans) }
.dc-form textarea:focus, .tp-row input:focus, .login input:focus { outline: 1px solid var(--accent); border-color: var(--accent) }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.chip { font-family: var(--mono); font-size: 10px; padding: 4px 9px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer }
.chip.on { color: var(--bg); border-color: transparent }
.chip.on.REAL { background: var(--red) } .chip.on.EXAGGERATED { background: var(--amber) } .chip.on.HYPE { background: var(--accent) }
.dc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.dc-hint { font-size: 11px; color: var(--dim) }
.cm { display: grid; gap: 5px; padding: 12px 14px; border-bottom: 1px solid var(--border); min-width: 0 }
.cm:last-child { border-bottom: none }
.cm.reply { margin-left: 22px; padding-left: 12px; border-left: 2px solid var(--s3); border-bottom: none; padding-block: 8px }
.cm-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--muted) }
.cm-head .who { color: var(--text); font-weight: 700; font-size: 11px }
.cm-body { font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere }
.cm-body.gone { color: var(--dim); font-style: italic }
.pos { font-family: var(--mono); font-size: 9px; padding: 1px 6px; border-radius: 3px; border: 1px solid }
.pos.GROW { color: var(--red); border-color: rgba(255,61,90,.5) } .pos.FADE { color: var(--green); border-color: rgba(0,230,118,.5) }
.vd { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 6px; border-radius: 3px; color: var(--bg) }
.cm-act { display: flex; gap: 12px; flex-wrap: wrap }
.cm-act button { background: none; border: none; padding: 0; font-family: var(--mono); font-size: 10px; color: var(--dim); cursor: pointer }
.cm-act button:hover { color: var(--accent) }
.cm-act button.danger:hover { color: var(--red) }
.mod { font-family: var(--mono); font-size: 9px; color: var(--amber) }
/* score breakdown */
.bd { display: grid; gap: 10px; padding: 14px }
.bd-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 76px; gap: 10px; align-items: center }
.bd-name { font-size: 12px; font-weight: 600 }
.bd-name small { display: block; font-family: var(--mono); font-size: 9px; color: var(--muted); font-weight: 400 }
.bd-bar { height: 8px; background: var(--s3); border-radius: 4px; overflow: hidden }
.bd-bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px }
.bd-pts { font-family: var(--mono); font-size: 12px; text-align: right }
.bd-pts span { color: var(--muted); font-size: 10px }
.bd-detail { grid-column: 2 / 4; font-size: 11px; color: var(--muted); margin-top: -6px }
.bd-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: var(--muted) }
.bd-sum b { color: var(--text) }
.bd-note { font-size: 12px; color: var(--muted); line-height: 1.55 }
.bd-note b { color: var(--text) }
@media (max-width: 500px) { .bd-row { grid-template-columns: 76px minmax(0, 1fr) 64px } }
.arena { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 3px; white-space: nowrap }
.arena.brands { background: rgba(179,136,255,.18); color: #c9a8ff; border: 1px solid rgba(179,136,255,.45) }
.arena.food { background: rgba(0,230,118,.12); color: var(--green); border: 1px solid rgba(0,230,118,.4) }
.sector { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 2px 7px; border-radius: 3px; background: rgba(0,200,240,.12); color: var(--accent); border: 1px solid rgba(0,200,240,.4); text-transform: uppercase; white-space: nowrap }
.trend { font-family: var(--mono); font-size: 10px; color: var(--amber) }
.co { font-size: 12px; color: var(--text); font-weight: 600 }
.co::before { content: "🏢 "; }
.house { padding: 10px 14px; font-size: 11px; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); background: var(--s2) }
.house b { color: var(--text) }
.buzz-bars { display: flex; align-items: flex-end; gap: 2px; height: 28px }
.buzz-bars i { flex: 1; background: var(--accent); opacity: .7; border-radius: 1px; min-width: 3px }
.fb { font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--amber); border: 1px solid rgba(255,179,0,.5); border-radius: 3px; padding: 0 5px; white-space: nowrap }
.tabs { display: flex; gap: 6px }
.tabs button { font-family: var(--mono); font-size: 10px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer }
.tabs button.on { color: var(--text); border-color: var(--accent) }
.tbl-wrap { overflow-x: auto }
table.lb { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px }
table.lb th { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 9px 14px; border-bottom: 1px solid var(--border) }
table.lb td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
table.lb th:nth-child(2), table.lb td:nth-child(2) { text-align: left }
table.lb td.name { font-family: var(--sans); font-weight: 600 }
table.lb tr.me td { background: rgba(0,200,240,.07) }
table.lb td.best { font-family: var(--sans); font-size: 11px; color: var(--muted); text-align: left; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
table.lb th.best { text-align: left }
.rk { color: var(--muted) } .rk.top { color: var(--amber); font-weight: 700 }
.mine { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px }
</style>

<header>
  <div class="logo">QUANTARA<em>/</em>STORIES</div>
  <nav class="nav">
    <a href="/narrative">← FSNI</a>
    <a href="/stories" id="nav-board">Listed stories</a>
    <a href="/leaderboard" id="nav-lb">Leaderboard</a>
    <a href="/history" id="nav-hist">My history</a>
    <a href="/">Exchange</a>
  </nav>
</header>

<main id="main"><div class="empty">Loading…</div></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : null;
function ago(ts) {
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function dur(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${String(m).padStart(2, "0")}m`;
}
function when(ts) {
  if (!ts) return "—";
  return new Date(ts * 1000).toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function scoreColor(v) { return v >= 60 ? "var(--red)" : v >= 30 ? "var(--amber)" : "var(--green)"; }
function delta(d) {
  if (d == null) return "";
  const c = d > 0.5 ? "up" : d < -0.5 ? "down" : "flat";
  const a = d > 0.5 ? "▲" : d < -0.5 ? "▼" : "●";
  return `<span class="${c}">${a} ${d >= 0 ? "+" : ""}${d.toFixed(1)} / 3h</span>`;
}
function spark(pts, w = 120, h = 30) {
  if (!pts || pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const xy = pts.map(p => [((p[0] - t0) / Math.max(1, t1 - t0)) * w, h - 2 - (Math.min(100, p[1]) / 100) * (h - 4)]);
  const y30 = h - 2 - 0.3 * (h - 4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y30}" y2="${y30}" stroke="var(--dim)" stroke-dasharray="2 3"/>
    <polyline fill="none" stroke="var(--amber)" stroke-width="1.6" points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}

// ── ACCOUNT (same login as the exchange and the FSNI page) ──
const ME = (() => { try { const id = localStorage.getItem("q_user_id"); return id ? { id, name: localStorage.getItem("q_username") || "" } : null; } catch (e) { return null; } })();
let LG = 0;
function loginHtml(why) {
  const k = ++LG;
  return `<div class="login"><div class="note" style="padding:0">${esc(why)}</div>
    <input id="lg-u${k}" placeholder="Username" autocomplete="username">
    <input id="lg-p${k}" type="password" placeholder="Password" autocomplete="current-password">
    <div class="tp-row"><button class="btn" onclick="doLogin(${k})">LOG IN</button><span class="tp-msg err" id="lg-msg${k}"></span></div></div>`;
}
async function doLogin(k) {
  const r = await fetch("/api/login_pw", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("#lg-u" + k).value, password: $("#lg-p" + k).value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("#lg-msg" + k).textContent = d.detail || "Login failed"; return; }
  try { localStorage.setItem("q_user_id", String(d.user_id)); localStorage.setItem("q_username", d.name); } catch (e) {}
  location.reload();
}
const cr = n => n == null ? "—" : Math.round(n).toLocaleString("en") + " cr";
const sgn = n => (n >= 0 ? "+" : "") + Math.round(n).toLocaleString("en");

const fBadge = n => `<span class="fb" title="Founding member — one of the first 100 traders">★ FOUNDER #${n}</span>`;
function navOn(id) { document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.id === id)); }

// ── LEADERBOARD ──
let LB_PERIOD = "all";
async function leaderboardPage() {
  document.title = "Leaderboard — Quantara"; navOn("nav-lb");
  const q = `?period=${LB_PERIOD}` + (ME ? "&user_id=" + encodeURIComponent(ME.id) : "");
  let d; try { d = await (await fetch("/api/stories/leaderboard" + q)).json(); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load the leaderboard.</div>`; return; }
  const key = LB_PERIOD === "week" ? "profit_week" : "profit";
  const row = r => `<tr class="${ME && r.user_id === String(ME.id) ? "me" : ""}">
    <td class="rk ${r.rank <= 3 ? "top" : ""}">${r.rank}</td>
    <td class="name">${esc(r.name)} ${r.founding ? fBadge(r.founding) : ""}</td>
    <td class="${r[key] >= 0 ? "down" : "up"}">${sgn(r[key])}</td>
    <td>${r.stories}</td>
    <td>${r.win_rate == null ? "—" : r.win_rate + "%"}</td>
    <td>${r.finished}${r.open ? ` <span style="color:var(--dim)">+${r.open} open</span>` : ""}</td>

// ── STORY ──
function chart(d) {
  const pts = d.points || [];
  if (pts.length < 2) return `<div class="empty">Score history builds up with each reading (every 15 minutes).</div>`;
  const W = 760, H = 240, L = 32, R = 10, T = 10, B = 22;
  const t0 = Math.min(pts[0][0], d.listed_at || pts[0][0]);
  const t1 = Math.max(pts[pts.length - 1][0], d.status === "LISTED" ? d.closes_at : 0);
  const X = t => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const Y = v => T + (1 - Math.min(100, v) / 100) * (H - T - B);
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const area = `${X(pts[0][0]).toFixed(1)},${Y(0)} ${line} ${X(pts[pts.length - 1][0]).toFixed(1)},${Y(0)}`;
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--s3)"/>
    <text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="var(--dim)" font-family="Space Mono, monospace">${v}</text>`).join("");
  const thr = d.rules.score;
  let marks = `<line x1="${L}" x2="${W - R}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="var(--amber)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W - R}" y="${Y(thr) - 4}" text-anchor="end" font-size="9" fill="var(--amber)" font-family="Space Mono, monospace">listing line ${thr}</text>`;
  if (d.bet && d.bet.kind === "line") marks += `<line x1="${L}" x2="${W - R}" y1="${Y(d.bet.line)}" y2="${Y(d.bet.line)}" stroke="var(--accent)" stroke-dasharray="6 3" opacity=".8"/>
    <text x="${L + 4}" y="${Y(d.bet.line) - 4}" font-size="9" fill="var(--accent)" font-family="Space Mono, monospace">line ${d.bet.line.toFixed(1)} — above: just the beginning · below: forgotten</text>`;
  if (d.listed_at) marks += `<line x1="${X(d.listed_at)}" x2="${X(d.listed_at)}" y1="${T}" y2="${H - B}" stroke="var(--amber)" opacity=".8"/>
    <text x="${X(d.listed_at) + 4}" y="${T + 9}" font-size="9" fill="var(--amber)" font-family="Space Mono, monospace">listed</text>`;
  if (d.closes_at) marks += `<line x1="${X(d.closes_at)}" x2="${X(d.closes_at)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${X(d.closes_at) - 4}" y="${T + 9}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Space Mono, monospace">${d.status === "CLOSED" ? "closed" : "closes"}</text>`;
  const tl = [t0, (t0 + t1) / 2, t1].map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][i]}" font-size="9" fill="var(--dim)" font-family="Space Mono, monospace">${esc(when(t))}</text>`).join("");
  const pp = (d.price_points || []).filter(p => p[0] >= t0);
  let pline = "";
  if (pp.length) {   // price only changes at trades / readings → step line, carried to the last score point
    const steps = [];
    pp.forEach((p, k) => { if (k) steps.push([p[0], pp[k - 1][1]]); steps.push(p); });
    const tEnd = Math.max(pts[pts.length - 1][0], pp[pp.length - 1][0]);
    steps.push([tEnd, pp[pp.length - 1][1]]);
    pline = steps.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  }
  window.__pts = pts; window.__pp = pp; window.__X = X; window.__Y = Y; window.__W = W;
  return `<svg id="sc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Story score over time">
    ${grid}${marks}
    <polygon points="${area}" fill="var(--amber)" opacity=".08"/>
    <polyline points="${line}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${pline ? `<polyline points="${pline}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>` : ""}
    <line id="sc-h" y1="${T}" y2="${H - B}" stroke="var(--text)" opacity="0" vector-effect="non-scaling-stroke"/>
    <circle id="sc-d" r="4" fill="var(--amber)" opacity="0"/>
    ${tl}
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="sc-hit"/>
  </svg><div class="chart-tip" id="sc-tip">Hover the chart for values</div>
  <div class="dc-legend" style="margin-top:4px"><span><i class="dot" style="background:var(--amber)"></i>story score</span>
    ${pline ? `<span><i class="dot" style="background:var(--accent)"></i>${d.bet && d.bet.kind === "line" ? "crowd chance it's just the beginning (%)" : "market price (GROW)"}</span>` : ""}</div>`;
}
function hookChart() {
  const svg = document.getElementById("sc"); if (!svg) return;
  const pts = window.__pts, X = window.__X, Y = window.__Y, W = window.__W;
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let i = 0, best = 1e9;
    pts.forEach((p, k) => { const dx = Math.abs(X(p[0]) - x); if (dx < best) { best = dx; i = k; } });
    const h = document.getElementById("sc-h"), c = document.getElementById("sc-d");
    h.setAttribute("x1", X(pts[i][0])); h.setAttribute("x2", X(pts[i][0])); h.setAttribute("opacity", ".5");
    c.setAttribute("cx", X(pts[i][0])); c.setAttribute("cy", Y(pts[i][1])); c.setAttribute("opacity", "1");
    const pp = window.__pp || [], t = pts[i][0];
    let pr = null; pp.forEach(p => { if (p[0] <= t + 60) pr = p[1]; });
    document.getElementById("sc-tip").textContent = `▸ score ${pts[i][1].toFixed(1)}${pr != null ? ` · price ${pr.toFixed(1)}` : ""} · ${when(t)}`;
  });
  svg.addEventListener("mouseleave", () => {
    document.getElementById("sc-h").setAttribute("opacity", "0");
    document.getElementById("sc-d").setAttribute("opacity", "0");
    document.getElementById("sc-tip").textContent = "Hover the chart for values";
  });
}

function cmHtml(c, isReply) {

function breakdownHtml(d) {
  const b = d.breakdown; if (!b) return "";
  const rows = b.parts.map(p => `<div class="bd-row">
      <span class="bd-name">${p.label}<small>weight ${p.weight}</small></span>
      <span class="bd-bar"><i style="width:${(100 * p.share).toFixed(1)}%"></i></span>
      <span class="bd-pts">${p.points.toFixed(1)} <span>/ ${p.weight}</span></span>
      <span class="bd-detail">${esc(p.detail)}</span></div>`).join("");
  const age = b.newest_age_h;
  const freshTxt = b.frozen ? `At the last reading the newest article was ${age.toFixed(1)}h old (freshness ×${b.freshness.toFixed(2)}).` : age <= 12
    ? `Newest article ${age.toFixed(1)}h old — no fade yet. Fading starts in ${(12 - age).toFixed(1)}h if nothing new appears.`
    : `Newest article ${age.toFixed(1)}h old — the score is fading (about 1.2% of the subtotal per hour, down to 30%).`;
  const quiet = b.quiet_at_close != null ? `<div class="bd-note">If <b>no new coverage</b> arrives: about <b>${b.quiet_in_12h.toFixed(1)}</b> in 12h and <b>${b.quiet_at_close.toFixed(1)}</b> when the window closes. New articles, outlets or regions push it above that.</div>` : "";
  return `<section class="panel">
    <div class="ph"><span class="lbl">What makes up the score</span><span class="mono" style="font-size:10px;color:var(--muted)">${b.frozen ? "frozen at its last reading · " : "as of "}${when(b.as_of)}</span></div>
    <div class="bd">
      ${rows}
      <div class="bd-sum"><span>Subtotal <b>${b.subtotal.toFixed(1)}</b></span><span>× freshness <b>${b.freshness.toFixed(2)}</b></span><span>= score <b style="color:${scoreColor(b.score)}">${b.score.toFixed(1)}</b></span></div>
      <div class="bd-note">${freshTxt}</div>
      ${quiet}
      ${b.complete ? "" : `<div class="bd-note">Severity and momentum appear from the next reading (within 15 minutes).</div>`}
    </div></section>`;
}

function fmtViews(n) {
  n = n || 0;
  return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n);
}

  const L = b.latest, ser = b.series || [];
  const mx = Math.max(1, ...ser.map(p => p[1] || 0));
  const bars = ser.slice(-24).map(p => `<i title="${p[1]} posts · ${esc(when(p[0]))}" style="height:${Math.max(2, 26 * (p[1] || 0) / mx)}px"></i>`).join("");
  const sec = document.createElement("section");
  sec.className = "panel"; sec.id = "buzz";
  sec.innerHTML = `<div class="ph"><span class="lbl">Social buzz · Bluesky · test</span><span class="tag">last 24h</span></div>
    <div class="tp">${L.status !== "OK" ? `<div class="note" style="padding:0">Not available right now${L.error ? ` (${esc(L.error.slice(0, 80))})` : ""}.</div>` : `
      <div class="mine" style="padding:0">
        <div class="stat"><span class="lbl">Posts</span><span class="v">${L.posts}</span></div>
        <div class="stat"><span class="lbl">Likes</span><span class="v">${L.likes}</span></div>
        <div class="stat"><span class="lbl">Reposts</span><span class="v">${L.reposts}</span></div>
        <div class="stat"><span class="lbl">Replies</span><span class="v">${L.replies}</span></div>
      </div>
      ${ser.length > 1 ? `<div class="buzz-bars">${bars}</div>` : ""}
      <div class="bd-note">Posts mentioning “${esc(L.query || "")}”, checked ${esc(when(L.ts))}. Shown for testing — it doesn't affect the score.</div>
      ${(L.sample || []).length ? `<div class="lbl" style="margin-top:4px">Most-liked posts · moderators</div>
        ${L.sample.map(p => `<div class="li" style="padding:6px 0"><span style="font-size:12px">${esc(p.text)}</span>
          <div class="m"><span>♥ ${p.likes}</span><span>↻ ${p.reposts}</span>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:10px">open</a>` : ""}</div></div>`).join("")}` : ""}`}
    </div>`;
  const mkt = document.getElementById("mkt");
  if (mkt && mkt.nextSibling) side.insertBefore(sec, mkt.nextSibling); else side.appendChild(sec);
}

// ── TRADING ──
let MK = null, UNITS = 10;
async function loadMarket(sid) {
  const q = ME ? "?user_id=" + encodeURIComponent(ME.id) : "";
  try { const r = await fetch("/api/stories/market/" + encodeURIComponent(sid) + q); if (!r.ok) return; MK = await r.json(); MK.sid = sid; }
  catch (e) { return; }
  renderMarket();
}
function preview(side, action, units) {      // same formula as the server
  const p0 = MK.price, move = MK.impact * units;
  const up = (side === "GROW") === (action === "OPEN");
  const mid = up ? p0 + move / 2 : p0 - move / 2;
  return (side === "GROW" ? mid : 100 - mid) * units;
}
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function isLine() { return MK && MK.bet && MK.bet.kind === "line"; }
function sideName(side, short) {
  if (!isLine()) return side;
  if (side === "GROW") return short ? "BEGINNING" : "JUST THE BEGINNING";
  const d = DAYS[new Date(MK.bet.closes_at * 1000).getDay()];
  return short ? "FORGOTTEN" : `FORGOTTEN BY ${d.toUpperCase()}`;
}
function renderMarket() {
  const el = $("#mkt"); if (!el || !MK) return;
  const pos = ((MK.me || {}).positions || []).filter(p => p.status === "OPEN");
  const held = pos[0];
  const lean = MK.offset;
  const leanTxt = Math.abs(lean) < 0.05 ? "no crowd lean yet" : `crowd lean ${lean > 0 ? "+" : ""}${lean.toFixed(1)}`;
  let body;
  if (MK.status !== "OPEN") {
    const mine = (MK.me || {}).positions || [];
    const lineRes = isLine() && MK.final != null ? (MK.final > MK.bet.line
      ? `It ended at <b>${MK.final.toFixed(1)}</b>, above its line of ${MK.bet.line.toFixed(1)}: <b>JUST THE BEGINNING</b> won and paid 100 per unit.`
      : `It ended at <b>${MK.final.toFixed(1)}</b>, at or below its line of ${MK.bet.line.toFixed(1)}: <b>FORGOTTEN</b> won and paid 100 per unit.`) : null;
    body = `<div class="note">${MK.status === "SETTLED" ? (lineRes || `Settled at final score <b>${(MK.final ?? 0).toFixed(1)}</b>. GROW paid ${(MK.final ?? 0).toFixed(1)} per unit, FADE ${(100 - (MK.final ?? 0)).toFixed(1)}.`)
      : STORY && STORY.status === "DELISTED" ? "This story was removed by the moderators. All positions were refunded." : "This story was merged into another listing. All positions were refunded."}</div>
      ${mine.map(p => `<div class="tp" style="padding-top:0"><div class="tp-pos">
        <div class="kv"><span>${sideName(p.side)} · ${p.units || ""} ${p.units ? "units" : ""}</span><b>${p.status}</b></div>
        <div class="kv"><span>Paid out</span><b>${cr(p.payout)}</b></div>
        <div class="kv"><span>Profit / loss</span><b class="${p.pnl >= 0 ? "down" : "up"}">${sgn(p.pnl)} cr</b></div></div></div>`).join("")}`;
  } else {
    const units = Math.max(1, Math.min(MK.max_units, UNITS | 0));
    const gCost = preview("GROW", "OPEN", units), fCost = preview("FADE", "OPEN", units);
    const canG = MK.open && ME && !(held && held.side === "FADE");
    const canF = MK.open && ME && !(held && held.side === "GROW");
    const L = isLine() ? MK.bet : null;
    body = `<div class="tp">
      ${L ? `<div class="bd-note" style="font-size:13px">Will people <b>still be talking about this</b> when the window closes ${DAYS[new Date(L.closes_at * 1000).getDay()]} ${when(L.closes_at).split(",").pop()}, or is it <b>already dying</b>?</div>` : ""}
      <div class="tp-prices">
        <div class="tp-side grow"><span class="lbl"><b>${sideName("GROW")}</b></span><span class="tp-price">${L ? Math.round(MK.price) + "%" : MK.price.toFixed(1)}</span>
          <span class="tp-pays">${L ? `Wins if the story ends <b>above ${L.line.toFixed(1)}</b> — more coverage than a normal fade. Pays 100 per unit.` : "Pays the final score. Wins if the story ends bigger than this."}</span></div>
        <div class="tp-side fade"><span class="lbl"><b>${sideName("FADE")}</b></span><span class="tp-price">${L ? (100 - Math.round(MK.price)) + "%" : MK.fade_price.toFixed(1)}</span>
          <span class="tp-pays">${L ? `Wins if the story ends <b>at or below ${L.line.toFixed(1)}</b> — it fizzles out. Pays 100 per unit.` : "Pays 100 − final score. Wins if the story ends smaller."}</span></div>
      </div>
      <div class="tp-cost">${L ? `The line is where the story should end if it fades normally (score now ${MK.score.toFixed(1)}, expected at close ${L.expected.toFixed(1)}). Price = the chance, in % and credits per unit · ${leanTxt}.` : `Price = score now ${MK.score.toFixed(1)} · ${leanTxt}.`} Each unit traded moves the price ${MK.impact} points.</div>
      ${!ME ? "" : MK.open ? `<div class="tp-row">
          <label class="lbl" for="tp-u">Units</label>
          <input id="tp-u" type="number" min="1" max="${MK.max_units}" value="${units}" oninput="UNITS=+this.value;renderCosts()">
          <button class="btn grow" id="b-g" ${canG ? "" : "disabled"} onclick="doTrade('GROW','OPEN')">${sideName("GROW", true)}</button>
          <button class="btn fade" id="b-f" ${canF ? "" : "disabled"} onclick="doTrade('FADE','OPEN')">${sideName("FADE", true)}</button>
        </div>
        <div class="tp-cost" id="tp-costs">${costLine(units)}</div>`
        : `<div class="note" style="padding:0">Trading is closed: ${esc(MK.closed_reason)}. Positions pay out when the window closes.</div>`}
      <div class="tp-msg" id="tp-msg"></div>
      ${held ? `<div class="tp-pos">
        <div class="kv"><span>Your position</span><b style="color:${held.side === "GROW" ? "var(--red)" : "var(--green)"}">${sideName(held.side)} · ${held.units} units</b></div>
        ${L ? `<div class="kv"><span>Pays if right</span><b>${cr(100 * held.units)}</b></div>` : ""}
        <div class="kv"><span>Average price</span><b>${held.avg?.toFixed(2)}</b></div>
        <div class="kv"><span>Cost · worth if closed now</span><b>${cr(held.cost)} · ${cr(held.value)}</b></div>
        <div class="kv"><span>Profit / loss now</span><b class="${held.pnl >= 0 ? "down" : "up"}">${sgn(held.pnl)} cr</b></div>
        ${MK.open ? `<div class="tp-row"><button class="btn ghost" onclick="doTrade('${held.side}','CLOSE',${held.units})">CLOSE ALL (${cr(preview(held.side, "CLOSE", held.units))})</button></div>` : ""}
      </div>` : ""}
      <div class="kv"><span>${MK.open ? "Trading stops" : "Trading stopped"} ${when(MK.trading_stops_at)}</span><span>${MK.traders} trader${MK.traders === 1 ? "" : "s"}</span></div>
      ${ME ? `<div class="kv"><span>Your credits</span><b>${cr(MK.me.credits)}</b></div>` : ""}
    </div>`;
  }
  el.innerHTML = `<div class="ph"><span class="lbl">Trade this story</span><span class="tag">virtual credits</span></div>
    ${body}
    ${!ME && MK.status === "OPEN" ? loginHtml("Log in with your Quantara account to trade. You start with 10,000 credits.") : ""}
    ${MK.trades.length ? `<div class="ph" style="border-top:1px solid var(--border)"><span class="lbl">Recent trades</span></div>
      ${MK.trades.slice(0, 10).map(t => `<div class="tr"><span>${esc(t.name)}</span><span><b class="${t.side}">${t.action === "CLOSE" ? "closed " : ""}${sideName(t.side, true)}</b> ${t.units} @ ${t.price.toFixed(1)}</span><span>${ago(t.ts)}</span></div>`).join("")}` : ""}`;
}
function costLine(u) {
  const g = preview("GROW", "OPEN", u), f = preview("FADE", "OPEN", u);
  return isLine()
    ? `${u} × ${sideName("GROW", true)} costs ${cr(g)} → pays ${cr(100 * u)} if right · ${u} × ${sideName("FADE", true)} costs ${cr(f)} → pays ${cr(100 * u)} if right`
    : `GROW ${u} costs ${cr(g)} · FADE ${u} costs ${cr(f)}`;
}
function renderCosts() {
  const u = Math.max(1, Math.min(MK.max_units, UNITS | 0)), el = $("#tp-costs");
  if (el) el.textContent = costLine(u);
}
async function doTrade(side, action, units) {
  units = units || Math.max(1, Math.min(MK.max_units, UNITS | 0));
  document.querySelectorAll("#mkt .btn").forEach(b => b.disabled = true);
  const r = await fetch("/api/stories/trade", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: ME.id, sid: MK.sid, side, action, units }) });
  const d = await r.json().catch(() => ({}));
  await loadMarket(MK.sid);
  const m = $("#tp-msg");
  if (!r.ok) { m.className = "tp-msg err"; m.textContent = d.detail || "Trade failed"; return; }
  m.className = "tp-msg ok";
  m.textContent = `${action === "CLOSE" ? "Closed" : "Bought"} ${d.units} ${sideName(side, true)} at ${d.price.toFixed(2)} — ${action === "CLOSE" ? "received" : "paid"} ${cr(d.credits)}. Price now ${d.new_price.toFixed(1)}.`;
}

const m = location.pathname.match(/^\/story\/([^/]+)/);
const PAGE = m ? "story" : location.pathname.startsWith("/leaderboard") ? "lb" : location.pathname.startsWith("/history") ? "hist" : "board";
if (m) story(decodeURIComponent(m[1])); else if (PAGE === "lb") leaderboardPage(); else if (PAGE === "hist") historyPage(); else board();
setInterval(() => { if (!document.hidden && !(m && (dcBusy() || REPLY_TO != null))) (m ? story(decodeURIComponent(m[1])) : PAGE === "lb" ? leaderboardPage() : PAGE === "hist" ? historyPage() : board()); }, 5 * 60 * 1000);
setInterval(() => { if (!document.hidden && m && MK && document.activeElement?.id !== "tp-u") loadMarket(MK.sid); }, 30 * 1000);
setInterval(() => { if (!document.hidden && m && DC_SID && !dcBusy() && REPLY_TO == null) loadComments(DC_SID); }, 30 * 1000);
</script>
